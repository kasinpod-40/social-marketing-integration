name: WooCommerce Integration Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integration/woocommerce-safe-wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/woocommerce-safe-wiring
          fetch-depth: 0
      - name: Apply reviewed shared wiring
        run: python3 scripts/apply-woocommerce-integration.py
      - name: Remove temporary apply files
        run: rm scripts/apply-woocommerce-integration.py .github/workflows/woocommerce-integration-apply.yml
      - name: Commit shared wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire guarded WooCommerce integration"
          git push origin HEAD:integration/woocommerce-safe-wiring
