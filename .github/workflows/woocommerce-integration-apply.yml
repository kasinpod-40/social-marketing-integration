name: WooCommerce Integration Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integration/woocommerce-safe-wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/woocommerce-safe-wiring
          fetch-depth: 0
      - name: Apply reviewed shared wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'packages/config/src/connector-catalog.js',
              """  [CONNECTOR_KEYS.WOOCOMMERCE]: freezeDefinition({
              key: CONNECTOR_KEYS.WOOCOMMERCE,
              displayName: 'WooCommerce',
              capability: 'commerce',
              implementationStatus: CONNECTOR_IMPLEMENTATION_STATUS.PLANNED,
              featureFlagEnv: 'MKT_CONNECTOR_WOOCOMMERCE_ENABLED',
              requiredRuntimeFields: ['accountKey'],
              largeAccount: plannedLargeAccount('orders', 5000),
            }),""",
              """  [CONNECTOR_KEYS.WOOCOMMERCE]: freezeDefinition({
              key: CONNECTOR_KEYS.WOOCOMMERCE,
              displayName: 'WooCommerce',
              capability: 'commerce',
              implementationStatus: CONNECTOR_IMPLEMENTATION_STATUS.UAT_PENDING,
              featureFlagEnv: 'MKT_CONNECTOR_WOOCOMMERCE_ENABLED',
              requiredRuntimeFields: ['accountKey'],
              largeAccount: plannedLargeAccount('orders', 5000),
            }),""",
          )

          replace_once(
              'packages/application/src/jobs/job-catalog.js',
              """  [JOB_TYPES.WOOCOMMERCE_COMMERCE_SYNC]: freezeJob({
              type: JOB_TYPES.WOOCOMMERCE_COMMERCE_SYNC,
              implementationStatus: JOB_IMPLEMENTATION_STATUS.PLANNED,
              connectorKey: CONNECTOR_KEYS.WOOCOMMERCE,
            }),""",
              """  [JOB_TYPES.WOOCOMMERCE_COMMERCE_SYNC]: freezeJob({
              type: JOB_TYPES.WOOCOMMERCE_COMMERCE_SYNC,
              implementationStatus: JOB_IMPLEMENTATION_STATUS.UAT_PENDING,
              connectorKey: CONNECTOR_KEYS.WOOCOMMERCE,
              manualOnly: true,
            }),""",
          )

          replace_once(
              'packages/application/src/jobs/queue-operation.js',
              """  [JOB_TYPES.META_ADS_SYNC, Object.freeze({
              prefix: 'meta_ads',
              scopeField: 'sourceAccountKey',
            })],
          ]);""",
              """  [JOB_TYPES.META_ADS_SYNC, Object.freeze({
              prefix: 'meta_ads',
              scopeField: 'sourceAccountKey',
            })],
            [JOB_TYPES.WOOCOMMERCE_COMMERCE_SYNC, Object.freeze({ prefix: 'woocommerce' })],
          ]);""",
          )
          replace_once(
              'packages/application/src/jobs/queue-operation.js',
              "return new Set(['facebook', 'instagram', 'tiktok', 'youtube']).has(prefix)",
              "return new Set(['facebook', 'instagram', 'tiktok', 'youtube', 'woocommerce']).has(prefix)",
          )

          replace_once(
              'packages/config/src/connector-runtime-config.js',
              """    const protectedUat = isProtectedGoogleAdsUatRuntime(definition, env)
              || isProtectedMetaUatRuntime(definition, env);""",
              """    const protectedUat = isProtectedGoogleAdsUatRuntime(definition, env)
              || isProtectedMetaUatRuntime(definition, env)
              || isProtectedWooCommerceUatRuntime(definition, env);""",
          )
          replace_once(
              'packages/config/src/connector-runtime-config.js',
              "function isProtectedMetaUatRuntime(definition, env) {",
              """function isProtectedWooCommerceUatRuntime(definition, env) {
            if (definition.key !== 'woocommerce'
              || definition.implementationStatus !== CONNECTOR_IMPLEMENTATION_STATUS.UAT_PENDING) {
              return false;
            }
            return env.MKT_ENV === 'development'
              && env.MKT_CUSTOMER_PROFILE === 'integration_workspace'
              && readOptionalBoolean(env.MKT_CONNECTOR_WOOCOMMERCE_ENABLED, 'MKT_CONNECTOR_WOOCOMMERCE_ENABLED') === true
              && readOptionalBoolean(env.MKT_WOOCOMMERCE_D1_WRITE_ENABLED, 'MKT_WOOCOMMERCE_D1_WRITE_ENABLED') === true
              && readOptionalBoolean(env.MKT_WOOCOMMERCE_LARK_WRITE_ENABLED, 'MKT_WOOCOMMERCE_LARK_WRITE_ENABLED') === true
              && readOptionalBoolean(env.MKT_SCHEDULE_WOOCOMMERCE_ENABLED, 'MKT_SCHEDULE_WOOCOMMERCE_ENABLED') !== true;
          }

          function isProtectedMetaUatRuntime(definition, env) {""",
          )

          replace_once(
              'packages/config/src/lark-table-config.js',
              """  rawAdsDaily: 'LARK_TABLE_RAW_ADS_DAILY',
          });""",
              """  rawAdsDaily: 'LARK_TABLE_RAW_ADS_DAILY',
            rawCommerceStores: 'LARK_TABLE_RAW_COMMERCE_STORES',
            rawCommerceOrders: 'LARK_TABLE_RAW_COMMERCE_ORDERS',
            rawCommerceOrderItems: 'LARK_TABLE_RAW_COMMERCE_ORDER_ITEMS',
            rawCommerceProducts: 'LARK_TABLE_RAW_COMMERCE_PRODUCTS',
            rawCommerceProductVariations: 'LARK_TABLE_RAW_COMMERCE_PRODUCT_VARIATIONS',
            rawCommerceCategories: 'LARK_TABLE_RAW_COMMERCE_CATEGORIES',
            rawCommerceCustomers: 'LARK_TABLE_RAW_COMMERCE_CUSTOMERS',
            rawCommerceCoupons: 'LARK_TABLE_RAW_COMMERCE_COUPONS',
            rawCommerceRefunds: 'LARK_TABLE_RAW_COMMERCE_REFUNDS',
            mktCommerceOrders: 'LARK_TABLE_MKT_COMMERCE_ORDERS',
            mktCommerceProducts: 'LARK_TABLE_MKT_COMMERCE_PRODUCTS',
            mktCommerceCustomers: 'LARK_TABLE_MKT_COMMERCE_CUSTOMERS',
            mktCommerceDaily: 'LARK_TABLE_MKT_COMMERCE_DAILY',
            mktCommerceProductDaily: 'LARK_TABLE_MKT_COMMERCE_PRODUCT_DAILY',
          });""",
          )

          replace_once(
              'apps/sync-worker/src/runtime-infrastructure.js',
              """import { D1GoogleAdsLiveAdmissionStore } from '../../../packages/connectors/src/google-ads/d1-google-ads-live-admission-store.js';
          import { createLarkBitableClientFromEnv }""",
              """import { D1GoogleAdsLiveAdmissionStore } from '../../../packages/connectors/src/google-ads/d1-google-ads-live-admission-store.js';
          import { D1WooCommerceCommerceStore } from '../../../packages/connectors/src/woocommerce/d1-woocommerce-commerce-store.js';
          import { D1WooCommerceReportSource } from '../../../packages/connectors/src/woocommerce/d1-woocommerce-report-source.js';
          import { createLarkBitableClientFromEnv }""",
          )
          replace_once(
              'apps/sync-worker/src/runtime-infrastructure.js',
              """  let googleAdsAdmissionStore = null;
            let mirrorOutbox = null;""",
              """  let googleAdsAdmissionStore = null;
            let wooCommerceStore = null;
            let wooCommerceReportSource = null;
            let mirrorOutbox = null;""",
          )
          replace_once(
              'apps/sync-worker/src/runtime-infrastructure.js',
              """    getGoogleAdsAdmissionStore() {
              googleAdsAdmissionStore ??= new D1GoogleAdsLiveAdmissionStore({ db: env?.MKT_STATE_DB });
              return googleAdsAdmissionStore;
            },
            getReliability() {""",
              """    getGoogleAdsAdmissionStore() {
              googleAdsAdmissionStore ??= new D1GoogleAdsLiveAdmissionStore({ db: env?.MKT_STATE_DB });
              return googleAdsAdmissionStore;
            },
            getWooCommerceCommerceStore() {
              wooCommerceStore ??= new D1WooCommerceCommerceStore({ db: env?.MKT_STATE_DB });
              return wooCommerceStore;
            },
            getWooCommerceReportSource() {
              wooCommerceReportSource ??= new D1WooCommerceReportSource({ db: env?.MKT_STATE_DB });
              return wooCommerceReportSource;
            },
            getReliability() {""",
          )

          replace_once(
              'apps/sync-worker/src/sync-worker.js',
              "import { processJobWithGoogleAdsUat } from './google-ads-active-job-router.js';",
              "import { processJobWithWooCommerceEndToEnd } from './woocommerce-active-job-router.js';",
          )
          replace_once(
              'apps/sync-worker/src/sync-worker.js',
              'const processJobImpl = dependencies.processJob ?? processJobWithGoogleAdsUat;',
              'const processJobImpl = dependencies.processJob ?? processJobWithWooCommerceEndToEnd;',
          )
          replace_once(
              'apps/sync-worker/src/index.js',
              """export {
            processJobWithYouTubeOrganicEndToEnd as processJob,
          } from './youtube-organic-active-job-router.js';""",
              """export {
            processJobWithWooCommerceEndToEnd as processJob,
          } from './woocommerce-active-job-router.js';""",
          )

          replace_once(
              '.dev.vars.example',
              """MKT_CONNECTOR_WOOCOMMERCE_ENABLED=false
          MKT_CONNECTOR_CHATWOOT_ENABLED=false""",
              """MKT_CONNECTOR_WOOCOMMERCE_ENABLED=false
          # WooCommerce Source/D1/Lark/Report เป็น Gate อิสระและปิดทุกค่าเป็น Default
          MKT_WOOCOMMERCE_D1_WRITE_ENABLED=false
          MKT_WOOCOMMERCE_LARK_WRITE_ENABLED=false
          MKT_WOOCOMMERCE_REPORT_READ_ENABLED=false
          MKT_WOOCOMMERCE_FULL_RECONCILIATION_ENABLED=false
          MKT_CONNECTOR_CHATWOOT_ENABLED=false""",
          )
          replace_once(
              '.dev.vars.example',
              """MKT_SCHEDULE_GOOGLE_ADS_ENABLED=false
          MKT_SCHEDULE_DAILY_REPORT_ENABLED=false""",
              """MKT_SCHEDULE_GOOGLE_ADS_ENABLED=false
          MKT_SCHEDULE_WOOCOMMERCE_ENABLED=false
          MKT_SCHEDULE_DAILY_REPORT_ENABLED=false""",
          )
          replace_once(
              '.dev.vars.example',
              """# WooCommerce / Chatwoot — Foundations ยังไม่ถูก Route เข้า Worker
          WOOCOMMERCE_BASE_URL=https://replace-with-customer-store.example
          WOOCOMMERCE_CONSUMER_KEY=replace-with-consumer-key
          WOOCOMMERCE_CONSUMER_SECRET=replace-with-consumer-secret
          CHATWOOT_BASE_URL=https://replace-with-chatwoot.example""",
              """# WooCommerce — Consumer Key/Secret ต้องเป็น read-only Customer credential และอยู่ใน Secret store
          WOOCOMMERCE_BASE_URL=https://replace-with-customer-store.example
          WOOCOMMERCE_CONSUMER_KEY=ck_replace-with-consumer-key
          WOOCOMMERCE_CONSUMER_SECRET=replace-with-consumer-secret
          WOOCOMMERCE_API_VERSION=wc/v3
          WOOCOMMERCE_API_TIMEOUT_MS=30000
          WOOCOMMERCE_PAGE_SIZE=100
          WOOCOMMERCE_INCREMENTAL_OVERLAP_SECONDS=300
          WOOCOMMERCE_MAX_PAGES_PER_INVOCATION=2
          WOOCOMMERCE_MAX_NESTED_PAGES=100
          WOOCOMMERCE_NESTED_CONCURRENCY=3
          WOOCOMMERCE_REVISION_LOOKBACK_DAYS=30
          WOOCOMMERCE_DEFAULT_CURRENCY=THB
          # Chatwoot Foundation ยังไม่ถูก Route เข้า Worker
          CHATWOOT_BASE_URL=https://replace-with-chatwoot.example""",
          )
          replace_once(
              '.dev.vars.example',
              """LARK_TABLE_RAW_YOUTUBE_ANALYTICS_DAILY=replace-with-table-id
          LARK_TABLE_MKT_ACCOUNTS=replace-with-table-id""",
              """LARK_TABLE_RAW_YOUTUBE_ANALYTICS_DAILY=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_STORES=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_ORDERS=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_ORDER_ITEMS=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_PRODUCTS=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_PRODUCT_VARIATIONS=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_CATEGORIES=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_CUSTOMERS=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_COUPONS=replace-with-table-id
          LARK_TABLE_RAW_COMMERCE_REFUNDS=replace-with-table-id
          LARK_TABLE_MKT_COMMERCE_ORDERS=replace-with-table-id
          LARK_TABLE_MKT_COMMERCE_PRODUCTS=replace-with-table-id
          LARK_TABLE_MKT_COMMERCE_CUSTOMERS=replace-with-table-id
          LARK_TABLE_MKT_COMMERCE_DAILY=replace-with-table-id
          LARK_TABLE_MKT_COMMERCE_PRODUCT_DAILY=replace-with-table-id
          LARK_TABLE_MKT_ACCOUNTS=replace-with-table-id""",
          )

          replace_once(
              'wrangler.sync.example.jsonc',
              '    "MKT_CONNECTOR_WOOCOMMERCE_ENABLED": "false",\n    "MKT_CONNECTOR_CHATWOOT_ENABLED": "false",',
              """    "MKT_CONNECTOR_WOOCOMMERCE_ENABLED": "false",
              "MKT_WOOCOMMERCE_D1_WRITE_ENABLED": "false",
              "MKT_WOOCOMMERCE_LARK_WRITE_ENABLED": "false",
              "MKT_WOOCOMMERCE_REPORT_READ_ENABLED": "false",
              "MKT_WOOCOMMERCE_FULL_RECONCILIATION_ENABLED": "false",
              "WOOCOMMERCE_BASE_URL": "https://replace-with-customer-store.example",
              "WOOCOMMERCE_API_VERSION": "wc/v3",
              "WOOCOMMERCE_API_TIMEOUT_MS": "30000",
              "WOOCOMMERCE_PAGE_SIZE": "100",
              "WOOCOMMERCE_INCREMENTAL_OVERLAP_SECONDS": "300",
              "WOOCOMMERCE_MAX_PAGES_PER_INVOCATION": "2",
              "WOOCOMMERCE_MAX_NESTED_PAGES": "100",
              "WOOCOMMERCE_NESTED_CONCURRENCY": "3",
              "WOOCOMMERCE_REVISION_LOOKBACK_DAYS": "30",
              "WOOCOMMERCE_DEFAULT_CURRENCY": "THB",
              "MKT_CONNECTOR_CHATWOOT_ENABLED": "false",""",
          )
          replace_once(
              'wrangler.sync.example.jsonc',
              '    "MKT_SCHEDULE_GOOGLE_ADS_ENABLED": "false",\n    "MKT_YOUTUBE_ANALYTICS_TIME": "07:50",',
              '    "MKT_SCHEDULE_GOOGLE_ADS_ENABLED": "false",\n    "MKT_SCHEDULE_WOOCOMMERCE_ENABLED": "false",\n    "MKT_YOUTUBE_ANALYTICS_TIME": "07:50",',
          )
          replace_once(
              'wrangler.sync.example.jsonc',
              '    "LARK_TABLE_RAW_YOUTUBE_ANALYTICS_DAILY": "replace-with-table-id",\n    "LARK_TABLE_MKT_ACCOUNTS": "replace-with-table-id",',
              """    "LARK_TABLE_RAW_YOUTUBE_ANALYTICS_DAILY": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_STORES": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_ORDERS": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_ORDER_ITEMS": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_PRODUCTS": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_PRODUCT_VARIATIONS": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_CATEGORIES": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_CUSTOMERS": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_COUPONS": "replace-with-table-id",
              "LARK_TABLE_RAW_COMMERCE_REFUNDS": "replace-with-table-id",
              "LARK_TABLE_MKT_COMMERCE_ORDERS": "replace-with-table-id",
              "LARK_TABLE_MKT_COMMERCE_PRODUCTS": "replace-with-table-id",
              "LARK_TABLE_MKT_COMMERCE_CUSTOMERS": "replace-with-table-id",
              "LARK_TABLE_MKT_COMMERCE_DAILY": "replace-with-table-id",
              "LARK_TABLE_MKT_COMMERCE_PRODUCT_DAILY": "replace-with-table-id",
              "LARK_TABLE_MKT_ACCOUNTS": "replace-with-table-id",""",
          )

          replace_once(
              'tests/application/job-catalog.test.js',
              'const definition = getJobDefinition(JOB_TYPES.WOOCOMMERCE_COMMERCE_SYNC);',
              'const definition = getJobDefinition(JOB_TYPES.CHATWOOT_CONVERSATIONS_SYNC);',
          )

          replace_once(
              'migrations/0017_woocommerce_commerce.sql',
              """-- WooCommerce Commerce additive migration proposal.
          -- Integration Chat must review, allocate the then-current migration number and apply remotely later.
          -- This file is not under migrations/ and is never executed by this Workstream.""",
              """-- WooCommerce Commerce additive Migration 0017.
          -- Allocated by Integration wiring; source-only until a separate Remote apply authorization.
          -- Additive tables/indexes only; no existing Business fact is modified by this file.""",
          )
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/woocommerce-integration-apply.yml
      - name: Commit shared wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire guarded WooCommerce integration"
          git push origin HEAD:integration/woocommerce-safe-wiring
