name: Refresh patched Undici lock once

on:
  push:
    branches:
      - work/lark-native-ai-disabled-configuration-preview-v1
    paths:
      - .github/workflows/refresh-undici-lock-once.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/lark-native-ai-disabled-configuration-preview-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin patched Undici transitively
        run: |
          npm pkg set overrides.undici=7.29.0
          npm install --package-lock-only --ignore-scripts --audit=false
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/undici']?.version!=='7.29.0') process.exit(1)"

      - name: Commit lock refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "fix: pin patched undici 7.29.0"
          git push origin HEAD:work/lark-native-ai-disabled-configuration-preview-v1
