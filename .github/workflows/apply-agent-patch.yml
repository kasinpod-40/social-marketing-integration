name: Apply and Verify Google Ads Signed Delivery

on:
  push:
    branches:
      - agent/google-ads-signed-delivery

permissions:
  contents: write

concurrency:
  group: apply-google-ads-signed-delivery
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-patch.part00 \
              .github/agent-patch.part01 \
              .github/agent-patch.part02 \
              .github/agent-patch.part03 \
              .github/agent-patch.part04 \
              .github/agent-patch.part05 > /tmp/google-ads-signed-delivery.patch.xz.b64
          echo '10366cbedb06247a5b887cf2fdd59f13e358aef0bfd8199a913268b9427754d8  /tmp/google-ads-signed-delivery.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/google-ads-signed-delivery.patch.xz.b64 > /tmp/google-ads-signed-delivery.patch.xz
          xz --decompress --stdout /tmp/google-ads-signed-delivery.patch.xz > /tmp/google-ads-signed-delivery.patch
          echo 'a8aec02e97271917092ebf6fe33da78538e11801166b153e87e318f4d3904e09  /tmp/google-ads-signed-delivery.patch' | sha256sum -c -

      - name: Apply patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply --binary --index /tmp/google-ads-signed-delivery.patch
          rm -f .github/agent-patch.part00 \
                .github/agent-patch.part01 \
                .github/agent-patch.part02 \
                .github/agent-patch.part03 \
                .github/agent-patch.part04 \
                .github/agent-patch.part05 \
                .github/workflows/apply-agent-patch.yml
          git add -A
          git diff --cached --check
          git status --short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax architecture and hygiene
        run: npm run check

      - name: Focused Google Ads signed delivery tests
        shell: bash
        run: node --test tests/google-ads/*.test.js

      - name: Focused staged TikTok regression
        shell: bash
        run: node --test tests/application/tiktok-staged-business-sync.test.js

      - name: Unit and Workers runtime regression
        run: npm test

      - name: Report reliability regression
        run: npm run test:report-reliability

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Wrangler deployment dry run
        run: npm run deploy:dry-run

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Google Ads signed delivery connector'
          git push origin "HEAD:${GITHUB_REF_NAME}"
