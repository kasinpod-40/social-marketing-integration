name: Apply Chatwoot D1 Backup Stream Hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'hotfix/chatwoot-final-d1-backup-stream-hash'
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-d1-backup-stream-hash
          fetch-depth: 0

      - name: Apply bounded backup integrity correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/chatwoot-final-30d-daily-uat.mjs')
          source = source_path.read_text()

          old_import = "import { execFileSync } from 'node:child_process';\n"
          new_import = old_import + "import { createReadStream } from 'node:fs';\n"
          if source.count(old_import) != 1:
              raise SystemExit('unexpected child-process import count')
          source = source.replace(old_import, new_import, 1)

          old_call = "  const backup = d1Backup(target);\n"
          new_call = "  const backup = await d1Backup(target);\n"
          if source.count(old_call) != 1:
              raise SystemExit('unexpected d1Backup call count')
          source = source.replace(old_call, new_call, 1)

          old_block = """function d1Backup(target) {
            const path = join(target.evidenceDir, `chatwoot-before-uat-${Date.now()}.sql`);
            run('npx', ['wrangler', 'd1', 'export', configName(target, 'databaseName'), '--remote',
              '--config', target.sourcePath, '--output', path, '--skip-confirmation'], { env: target.cf.env });
            const bytes = execFileSync('cat', [path]);
            if (!bytes.length) fail('D1 backup is empty', 'CHATWOOT_FINAL_UAT_BACKUP_EMPTY');
            return { backupFile: relative(ROOT, path), backupBytes: bytes.length,
              backupSha256: createHash('sha256').update(bytes).digest('hex') };
          }
          """
          new_block = """async function d1Backup(target) {
            const path = join(target.evidenceDir, `chatwoot-before-uat-${Date.now()}.sql`);
            run('npx', ['wrangler', 'd1', 'export', configName(target, 'databaseName'), '--remote',
              '--config', target.sourcePath, '--output', path, '--skip-confirmation'], { env: target.cf.env });
            let metadata;
            try {
              metadata = await stat(path);
            } catch (cause) {
              fail('D1 backup could not be inspected', 'CHATWOOT_FINAL_UAT_BACKUP_INSPECTION_FAILED', {
                errorCode: cause?.code ?? null,
              });
            }
            if (!metadata.isFile() || metadata.size <= 0) {
              fail('D1 backup is empty', 'CHATWOOT_FINAL_UAT_BACKUP_EMPTY');
            }
            const hash = createHash('sha256');
            try {
              for await (const chunk of createReadStream(path)) hash.update(chunk);
            } catch (cause) {
              fail('D1 backup could not be hashed', 'CHATWOOT_FINAL_UAT_BACKUP_HASH_FAILED', {
                errorCode: cause?.code ?? null,
              });
            }
            return {
              backupFile: relative(ROOT, path),
              backupBytes: metadata.size,
              backupSha256: hash.digest('hex'),
            };
          }
          """
          if source.count(old_block) != 1:
              raise SystemExit('unexpected d1Backup implementation count')
          source = source.replace(old_block, new_block, 1)
          source_path.write_text(source)

          test_path = Path('tests/application/chatwoot-final-30d-daily-uat.test.js')
          tests = test_path.read_text()
          marker = "test('D1 backup integrity is streamed without child-process buffering', async () => {"
          if marker not in tests:
              tests += """

test('D1 backup integrity is streamed without child-process buffering', async () => {
  const source = await readFile(
    new URL('../../scripts/chatwoot-final-30d-daily-uat.mjs', import.meta.url),
    'utf8',
  );
  assert.match(source, /const backup = await d1Backup\(target\)/u);
  assert.match(source, /for await \(const chunk of createReadStream\(path\)\)/u);
  assert.match(source, /backupBytes: metadata\.size/u);
  assert.match(source, /CHATWOOT_FINAL_UAT_BACKUP_HASH_FAILED/u);
  assert.doesNotMatch(source, /execFileSync\('cat'/u);
});
"""
          test_path.write_text(tests)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/chatwoot-final-30d-daily-uat.mjs tests/application/chatwoot-final-30d-daily-uat.test.js
          git commit -m "fix: stream Chatwoot D1 backup integrity"
          git push origin HEAD:hotfix/chatwoot-final-d1-backup-stream-hash
