name: WooCommerce Merge Closeout Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/woocommerce-integration-merge-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/woocommerce-integration-merge-closeout
          fetch-depth: 0
      - name: Apply Project Brain closeout
        run: python3 scripts/apply-woocommerce-merge-closeout-project-brain.py
      - name: Remove temporary apply files
        run: rm scripts/apply-woocommerce-merge-closeout-project-brain.py .github/workflows/woocommerce-merge-closeout-apply.yml
      - name: Commit closeout update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: update Project Brain for WooCommerce merge"
          git push origin HEAD:docs/woocommerce-integration-merge-closeout
