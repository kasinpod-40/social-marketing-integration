name: Apply YouTube Queue Timeout Hotfix

on:
  push:
    branches:
      - hotfix/youtube-queue-max-wait-time-ms

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/youtube-queue-max-wait-time-ms
          fetch-depth: 0

      - name: Apply compatibility patch and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import subprocess

          parser_path = Path('scripts/lib/youtube-live-remote-contract-parser.js')
          parser = parser_path.read_text()
          old_return = """    return Object.freeze({
              ...consumer,
              queue_name: expectedQueueName,
              ...(consumer.settings && typeof consumer.settings === 'object'
                ? { settings: Object.freeze({ ...consumer.settings }) }
                : {}),
            });
          """
          new_return = """    const settings = normalizeQueueConsumerSettings(consumer, {
              expectedQueueName,
              index,
            });
            return Object.freeze({
              ...consumer,
              queue_name: expectedQueueName,
              ...(settings ? { settings } : {}),
            });
          """
          if old_return not in parser:
              raise SystemExit('parser return block drifted')
          parser = parser.replace(old_return, new_return, 1)

          marker = """function unwrapQueueConsumers(value) {
          """
          helper = """function normalizeQueueConsumerSettings(consumer, input = {}) {
            const rawSettings = consumer?.settings;
            if (rawSettings !== undefined
              && (!rawSettings || typeof rawSettings !== 'object' || Array.isArray(rawSettings))) {
              throw parserError(
                'Scoped Queue consumer settings must be an object when present',
                'YOUTUBE_DRY_RUN_REMOTE_CONTRACT_INVALID',
                { expectedQueueName: input.expectedQueueName, index: input.index },
              );
            }
            const settings = rawSettings ? { ...rawSettings } : {};
            const seconds = readEquivalentQueueInteger([
              settings.max_batch_timeout,
              consumer?.max_batch_timeout,
            ], 'max_batch_timeout', input);
            const milliseconds = readEquivalentQueueInteger([
              settings.max_wait_time_ms,
              consumer?.max_wait_time_ms,
            ], 'max_wait_time_ms', input);

            let normalizedSeconds = seconds;
            if (milliseconds !== null) {
              if (milliseconds % 1000 !== 0) {
                throw parserError(
                  'Remote Queue max_wait_time_ms must resolve to whole seconds',
                  'YOUTUBE_DRY_RUN_REMOTE_QUEUE_TIMEOUT_INVALID',
                  {
                    expectedQueueName: input.expectedQueueName,
                    index: input.index,
                    maxWaitTimeMs: milliseconds,
                  },
                );
              }
              const millisecondsAsSeconds = milliseconds / 1000;
              if (normalizedSeconds !== null && normalizedSeconds !== millisecondsAsSeconds) {
                throw parserError(
                  'Remote Queue timeout fields disagree',
                  'YOUTUBE_DRY_RUN_REMOTE_QUEUE_TIMEOUT_MISMATCH',
                  {
                    expectedQueueName: input.expectedQueueName,
                    index: input.index,
                    maxBatchTimeout: normalizedSeconds,
                    maxWaitTimeMs: milliseconds,
                  },
                );
              }
              normalizedSeconds = millisecondsAsSeconds;
            }
            if (normalizedSeconds !== null) {
              settings.max_batch_timeout = normalizedSeconds;
            }
            return Object.keys(settings).length > 0 ? Object.freeze(settings) : null;
          }

          function readEquivalentQueueInteger(values, fieldName, input = {}) {
            const present = values.filter((value) => value !== undefined && value !== null);
            if (present.length === 0) return null;
            const normalized = present.map((value) => {
              const number = Number(value);
              if (!Number.isSafeInteger(number) || number < 0) {
                throw parserError(
                  `Remote Queue ${fieldName} must be a non-negative integer`,
                  'YOUTUBE_DRY_RUN_REMOTE_QUEUE_TIMEOUT_INVALID',
                  { expectedQueueName: input.expectedQueueName, index: input.index, fieldName },
                );
              }
              return number;
            });
            if (new Set(normalized).size !== 1) {
              throw parserError(
                `Remote Queue ${fieldName} appears with conflicting values`,
                'YOUTUBE_DRY_RUN_REMOTE_QUEUE_TIMEOUT_MISMATCH',
                { expectedQueueName: input.expectedQueueName, index: input.index, fieldName },
              );
            }
            return normalized[0];
          }

          function unwrapQueueConsumers(value) {
          """
          if marker not in parser:
              raise SystemExit('parser insertion marker drifted')
          parser = parser.replace(marker, helper, 1)
          parser_path.write_text(parser)

          test_path = Path('tests/application/youtube-live-remote-contract-parser.test.js')
          tests = test_path.read_text()
          tests = tests.replace('        max_batch_timeout: 30,', '        max_wait_time_ms: 30000,', 1)
          old_assert = """  assert.equal(normalized[0].queue_name, MAIN_QUEUE);
            assert.equal(normalized[0].settings.dead_letter_queue, DLQ);
          });
          """
          new_assert = """  assert.equal(normalized[0].queue_name, MAIN_QUEUE);
            assert.equal(normalized[0].settings.max_wait_time_ms, 30000);
            assert.equal(normalized[0].settings.max_batch_timeout, 30);
            assert.equal(normalized[0].settings.dead_letter_queue, DLQ);
          });

          test('scoped Queue parser fails closed on invalid or conflicting timeout representations', () => {
            for (const settings of [
              { max_wait_time_ms: -1 },
              { max_wait_time_ms: 30001 },
              { max_wait_time_ms: 31000, max_batch_timeout: 30 },
            ]) {
              assert.throws(
                () => normalizeScopedWranglerQueueConsumers({
                  consumers: [{ settings }],
                }, { expectedQueueName: MAIN_QUEUE }),
                (error) => [
                  'YOUTUBE_DRY_RUN_REMOTE_QUEUE_TIMEOUT_INVALID',
                  'YOUTUBE_DRY_RUN_REMOTE_QUEUE_TIMEOUT_MISMATCH',
                ].includes(error.code),
              );
            }
          });
          """
          if old_assert not in tests:
              raise SystemExit('test insertion block drifted')
          tests = tests.replace(old_assert, new_assert, 1)
          tests = tests.replace('    max_batch_timeout: 30,', '    max_wait_time_ms: 30000,', 1)
          test_path.write_text(tests)

          base_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          stamp = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          current = Path('docs/current-task.md')
          archive = Path(f'docs/archive/current-task-before-youtube-queue-timeout-hotfix-{stamp}.md')
          archive.write_text(current.read_text())

          current.write_text(f'''# Current Task — YouTube Queue Timeout Remote Compatibility Hotfix

## Authoritative status

```text
TASK_STATUS                         = REPOSITORY_HOTFIX_IMPLEMENTED_CI_PENDING
CURRENT_PROGRAM                     = YOUTUBE_QUEUE_TIMEOUT_REMOTE_COMPATIBILITY_HOTFIX
BASE_MAIN_SHA                       = {base_sha}
BRANCH                              = hotfix/youtube-queue-max-wait-time-ms
REMOTE_READ_ONLY_PREFLIGHT          = FAIL_CLOSED_AT_QUEUE_TIMEOUT_PARSE
REMOTE_MUTATION                     = NONE
PROVIDER_CALL                       = NOT_RUN
QUEUE_MESSAGE                       = NOT_SENT
D1_WRITE                            = NONE
LARK_REQUEST                        = NOT_RUN
WORKER_DEPLOYMENT                   = NOT_RUN
PRODUCTION                          = BLOCKED
```

The preceding YouTube rollout-readiness task is preserved verbatim at:

```text
{archive.as_posix()}
```

## Incident

The authorized Remote read-only preflight reached the scoped Main Queue/DLQ metadata and stopped with:

```text
YOUTUBE_DRY_RUN_COUNT_INVALID
remoteMaxBatchTimeout must be a non-negative integer
```

Cloudflare's current Queue Consumers API represents the Worker consumer wait time as
`settings.max_wait_time_ms` in milliseconds. The reviewed validator expected normalized
`max_batch_timeout` seconds, so the compatibility adapter passed an undefined timeout into the strict
validator. The operation stopped before all mutations; no Provider, Queue send, D1 write, Lark request or
Worker deployment occurred.

## Hotfix contract

- accept the official `settings.max_wait_time_ms` Remote field;
- require a non-negative safe integer;
- require exact whole-second conversion (`milliseconds % 1000 === 0`);
- normalize milliseconds to the existing reviewed `max_batch_timeout` seconds contract;
- preserve legacy explicit seconds support;
- reject conflicting top-level/settings values and seconds/milliseconds disagreement;
- preserve exact Queue command context, D1 UUID, flags, Secrets, consumers, Cron, routes, workers.dev,
  traffic and Remote fingerprint validation;
- perform no Remote mutation during Repository implementation.

## Acceptance

```text
30000 ms                          -> 30 s / accepted
negative ms                       -> fail closed
fractional second milliseconds    -> fail closed
seconds/ms mismatch               -> fail closed
Main Queue and DLQ contexts       -> remain distinct
Remote fingerprint                -> unchanged after normalization
Full Repository gates             -> required
```

## Remaining sequence

```text
Focused tests
→ full Branch Verification
→ Integration review
→ Squash Merge
→ rerun the same one-command Remote read-only preflight
```
''')

          task_path = Path('docs/tasks/youtube-queue-timeout-remote-compatibility-hotfix.md')
          task_path.write_text(f'''# YouTube Queue Timeout Remote Compatibility Hotfix

## Status

```text
BASE_MAIN_SHA                   = {base_sha}
BRANCH                          = hotfix/youtube-queue-max-wait-time-ms
REMOTE_ACTIONS_DURING_HOTFIX    = NONE
```

## Root cause

Cloudflare Queue Consumers API returns push-consumer wait time as `settings.max_wait_time_ms`. The
strict YouTube Remote validator compares seconds through `max_batch_timeout`. The live compatibility
adapter handled omitted Queue names and D1 display names but did not normalize this official API field.

## Implementation

Normalize exact integer milliseconds into whole seconds before delegation to the strict validator. Do
not default or invent a timeout when the API omits all supported timeout fields. Reject malformed,
negative, fractional-second and conflicting representations.

## Required tests

- official `max_wait_time_ms=30000` produces `max_batch_timeout=30`;
- full sanitized Remote fingerprint still matches;
- negative, non-whole-second and conflicting values fail closed;
- legacy explicit seconds remains supported;
- unrelated YouTube/TikTok/Core tests and standard Repository gates pass.
''')

          brain_path = Path('docs/project-brain/youtube-queue-timeout-remote-compatibility-hotfix-2026-07-28.md')
          brain_path.write_text('''# Project Brain — YouTube Queue Timeout Remote Compatibility Hotfix

## Durable incident fact

The YouTube Remote read-only preflight authenticated and read Remote metadata, then failed closed before
mutation because Cloudflare exposed Queue wait time as `settings.max_wait_time_ms`, while the strict
validator consumed normalized seconds as `max_batch_timeout`.

## Decision

Treat the Cloudflare API field as authoritative only when it is a non-negative safe integer and exactly
convertible to whole seconds. Preserve the existing strict fingerprint contract after normalization.
Never default an absent Remote timeout from Local configuration.

## Safety

Repository hotfix only. No Worker deployment, Queue send/Ack/Retry/DLQ action, D1 write/migration,
YouTube/Lark request, Schedule/route/Secret mutation or Production action.
''')

          Path('.github/workflows/apply-youtube-queue-timeout-hotfix.yml').unlink()
          PY

      - name: Verify focused syntax and tests
        shell: bash
        run: |
          node --check scripts/lib/youtube-live-remote-contract-parser.js
          node --check tests/application/youtube-live-remote-contract-parser.test.js
          node --test tests/application/youtube-live-remote-contract-parser.test.js tests/application/youtube-live-parser-rollout-wiring.test.js tests/application/youtube-remote-read-only-preflight.test.js
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/lib/youtube-live-remote-contract-parser.js tests/application/youtube-live-remote-contract-parser.test.js docs/current-task.md docs/archive docs/tasks docs/project-brain .github/workflows/apply-youtube-queue-timeout-hotfix.yml
          git commit -m "fix: normalize Cloudflare queue wait time"
          git push origin HEAD:hotfix/youtube-queue-max-wait-time-ms
