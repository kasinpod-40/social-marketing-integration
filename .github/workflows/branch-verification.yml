name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_assetgroups_mapping:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Locate Asset Groups table mapping evidence safely
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"

          PRIMARY_REPO="$repo" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const repo = process.env.PRIMARY_REPO;
          const needles = ['LARK_TABLE_MKT_ADS_ASSET_GROUPS', 'MKT_Ads_AssetGroups'];
          const skip = new Set(['.git', 'node_modules', '.wrangler']);
          const hits = [];

          function walk(dir, depth = 0) {
            if (depth > 6) return;
            let entries;
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
            for (const entry of entries) {
              if (skip.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, depth + 1);
                continue;
              }
              if (!entry.isFile()) continue;
              let stat;
              try { stat = fs.statSync(full); } catch { continue; }
              if (stat.size > 20 * 1024 * 1024) continue;
              let text;
              try { text = fs.readFileSync(full, 'utf8'); } catch { continue; }
              const found = needles.filter((needle) => text.includes(needle));
              if (found.length) hits.push({ file: path.relative(repo, full), found });
            }
          }

          walk(repo);
          console.log(`assetgroups_reference_file_count=${hits.length}`);
          for (const hit of hits.sort((a,b) => a.file.localeCompare(b.file))) {
            console.log(`reference_file=${hit.file} keys=${hit.found.join(',')}`);
          }

          const devVars = path.join(repo, '.dev.vars');
          if (fs.existsSync(devVars)) {
            const text = fs.readFileSync(devVars, 'utf8');
            const match = text.match(/^\s*(?:export\s+)?LARK_TABLE_MKT_ADS_ASSET_GROUPS\s*=\s*(.+?)\s*$/mu);
            const value = match?.[1]?.trim().replace(/^['"]|['"]$/gu, '') ?? '';
            console.log(`dev_vars_assetgroups_key=${Boolean(match)}`);
            console.log(`dev_vars_assetgroups_value_looks_table_id=${/^tbl[A-Za-z0-9]+$/u.test(value)}`);
          } else {
            console.log('dev_vars_assetgroups_key=false');
            console.log('dev_vars_assetgroups_value_looks_table_id=false');
          }
          NODE
