name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_final_local_cleanup:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 8
    steps:
      - name: Remove temporary closure worktrees and scratch configs
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          verifier_worktree="/private/tmp/google-ads-final-verifier-20260822"
          current_main="88d7f69fe42a437bdb344893b61a2f02c7b701ca"
          evidence="$repo/outputs/google-ads-live-operator"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$current_main"
          test -f "$evidence/paid-parity-20260822/verify.json"
          test -f "$evidence/paid-parity-20260822/rerun-verify.json"
          test -f "$evidence/paid-parity-final-verify-20260822/final-state.json"
          test -f "$evidence/paid-parity-direct-recovery-v2-20260822/final.json"

          if [ -d "$verifier_worktree" ]; then
            git -C "$repo" worktree remove --force "$verifier_worktree" >/dev/null 2>&1 || rm -rf "$verifier_worktree"
          fi

          if [ -d "$live_worktree" ]; then
            rm -f \
              "$live_worktree/google-ads-direct-recovery-entry.js" \
              "$live_worktree/wrangler.google-ads-direct-recovery.jsonc" \
              "$live_worktree/wrangler.api.google-ads-live-active.jsonc" \
              "$live_worktree/wrangler.sync.google-ads-live-active.jsonc" \
              "$live_worktree/.dev.vars"
            git -C "$repo" worktree remove --force "$live_worktree" >/dev/null 2>&1 || rm -rf "$live_worktree"
          fi
          git -C "$repo" worktree prune

          test ! -e "$verifier_worktree"
          test ! -e "$live_worktree"
          echo 'temporary_verifier_worktree_removed=true'
          echo 'temporary_live_worktree_removed=true'
          echo 'closure_evidence_retained=true'
          echo 'cleanup_remote_mutation_count=0'
          echo 'google_ads_local_cleanup=passed'
