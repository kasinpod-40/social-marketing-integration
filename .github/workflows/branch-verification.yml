name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_assetgroups_evidence:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Inspect Asset Groups inventory evidence with identifiers masked
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"

          PRIMARY_REPO="$repo" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const repo = process.env.PRIMARY_REPO;
          const inventory = path.join(repo, 'outputs/lark-native-ai-remote-inventory/inventory-summary.json');
          const text = fs.readFileSync(inventory, 'utf8');
          const needle = 'MKT_Ads_AssetGroups';
          let from = 0;
          let count = 0;
          while (true) {
            const i = text.indexOf(needle, from);
            if (i < 0) break;
            count++;
            const raw = text.slice(Math.max(0, i - 500), Math.min(text.length, i + needle.length + 500));
            const tableIds = raw.match(/tbl[A-Za-z0-9]+/gu) ?? [];
            const redacted = raw
              .replace(/tbl[A-Za-z0-9]+/gu, '<TABLE_ID>')
              .replace(/cli_[A-Za-z0-9]+/gu, '<APP_ID>')
              .replace(/[A-Fa-f0-9]{32,}/gu, '<HEX>');
            console.log(`occurrence=${count} nearby_table_id_count=${tableIds.length} unique_nearby_table_ids=${new Set(tableIds).size}`);
            console.log(`redacted_context=${JSON.stringify(redacted)}`);
            from = i + needle.length;
          }
          console.log(`assetgroups_occurrence_count=${count}`);

          const scriptDir = path.join(repo, 'scripts');
          const scriptNames = fs.readdirSync(scriptDir)
            .filter((name) => /lark|inventory|table/i.test(name))
            .sort();
          console.log(`candidate_script_count=${scriptNames.length}`);
          for (const name of scriptNames) console.log(`candidate_script=${name}`);
          NODE
