name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_pending_migrations:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 15
    steps:
      - name: List exact remote pending migrations read-only
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"
          evidence_root="$repo/outputs/google-ads-live-operator/paid-parity-20260822"
          sync_config="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test -z "$(git -C "$live_worktree" status --porcelain --untracked-files=all)"
          test -f "$evidence_root/backup.json"
          test -f "$sync_config"

          cd "$live_worktree"
          database_name="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const d=(c.d1_databases||[]).find(x=>x.binding==="MKT_STATE_DB");if(!d?.database_name)process.exit(1);process.stdout.write(d.database_name)' "$sync_config")"
          npx wrangler d1 migrations list "$database_name" --remote --config "$sync_config" > /tmp/google-ads-pending-migrations.txt
          cat /tmp/google-ads-pending-migrations.txt
          echo "remote_d1_mutation_count=0"
          echo "google_live_execute_count=0"
          echo "lark_write_count=0"
