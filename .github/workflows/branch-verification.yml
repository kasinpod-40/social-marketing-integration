name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_live_backup:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 30
    steps:
      - name: Execute reviewed Google Ads D1 backup
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"
          evidence_root="$repo/outputs/google-ads-live-operator/paid-parity-20260822"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test "$(git -C "$live_worktree" branch --show-current)" = main
          test -z "$(git -C "$live_worktree" status --porcelain --untracked-files=all)"
          test -f "$evidence_root/preflight.json"
          test -f "$live_worktree/wrangler.api.google-ads-live-safe.jsonc"
          test -f "$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"

          cd "$live_worktree"
          PRIMARY_REPO="$repo" LIVE_WORKTREE="$live_worktree" EVIDENCE_ROOT="$evidence_root" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { readDevVars } from './scripts/lib/dev-vars.js';

          const repo = process.env.PRIMARY_REPO;
          const live = process.env.LIVE_WORKTREE;
          const evidenceRoot = process.env.EVIDENCE_ROOT;
          const apiSafePath = resolve(live, 'wrangler.api.google-ads-live-safe.jsonc');
          const syncSafePath = resolve(live, 'wrangler.sync.google-ads-live-safe.jsonc');
          const sync = JSON.parse(await readFile(syncSafePath, 'utf8'));
          const stateDb = (sync.d1_databases ?? []).find((entry) => entry?.binding === 'MKT_STATE_DB');
          const managerId = String(sync.vars?.MKT_GOOGLE_ADS_MANAGER_CUSTOMER_ID ?? '').replace(/-/gu, '').trim();
          const advertiserId = String(sync.vars?.MKT_GOOGLE_ADS_ADVERTISER_CUSTOMER_ID ?? '').replace(/-/gu, '').trim();
          if (!String(stateDb?.database_name ?? '').trim() || !/^\d{10}$/u.test(managerId) || !/^\d{10}$/u.test(advertiserId)) process.exit(1);

          const preflight = JSON.parse(await readFile(resolve(evidenceRoot, 'preflight.json'), 'utf8'));
          if (preflight.phase !== 'preflight' || preflight.status !== 'passed' || preflight.repositoryHead !== '00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae') process.exit(1);

          const devVars = await readDevVars(resolve(repo, '.dev.vars'));
          const env = {
            ...process.env,
            ...devVars,
            MKT_ENV: 'development',
            MKT_CUSTOMER_PROFILE: 'integration_workspace',
            MKT_CONNECTION_CUSTOMER_KEY: 'chemistry_k',
            MKT_GOOGLE_ADS_SOURCE_TIMEZONE: 'Asia/Bangkok',
            MKT_GOOGLE_ADS_LIVE_DATABASE_NAME: stateDb.database_name,
            MKT_GOOGLE_ADS_LIVE_API_WRANGLER_CONFIG: apiSafePath,
            MKT_GOOGLE_ADS_LIVE_SYNC_WRANGLER_CONFIG: syncSafePath,
            MKT_GOOGLE_ADS_MANAGER_CUSTOMER_ID: managerId,
            MKT_GOOGLE_ADS_ADVERTISER_CUSTOMER_ID: advertiserId,
            MKT_GOOGLE_ADS_LIVE_EVIDENCE_DIR: evidenceRoot,
            CONFIRM_GOOGLE_ADS_LIVE_BACKUP: 'backup',
          };
          const result = spawnSync(process.execPath, ['scripts/google-ads-live-operator.mjs', '--phase=backup', '--execute'], {
            cwd: live, env, encoding: 'utf8', maxBuffer: 64 * 1024 * 1024,
          });
          if (result.status !== 0) {
            process.stdout.write(result.stdout || '');
            process.stderr.write(result.stderr || '');
            process.exit(result.status || 1);
          }
          const evidence = JSON.parse(await readFile(resolve(evidenceRoot, 'backup.json'), 'utf8'));
          if (evidence.phase !== 'backup' || evidence.status !== 'passed') process.exit(1);
          console.log('backup_status=passed');
          console.log(`repository_head=${evidence.repositoryHead}`);
          console.log('remote_d1_mutation_count=0');
          console.log('google_live_execute_count=0');
          console.log('lark_write_count=0');
          NODE
