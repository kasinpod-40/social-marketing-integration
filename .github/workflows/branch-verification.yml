name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_safe_restore_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 8
    steps:
      - name: Read prior safe deploy failures
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          evidence_root="$repo/outputs/google-ads-live-operator/paid-parity-manual-live-retry-20260822"
          for file in api-safe-initial.txt sync-safe-initial.txt api-safe-final.txt sync-safe-final.txt; do
            path="$evidence_root/$file"
            echo "--- $file ---"
            if [ -f "$path" ]; then
              tail -n 120 "$path" \
                | sed -E 's/(token|secret|password|signature|authorization)[=: ]+[^ ]+/\1=<REDACTED>/Ig'
            else
              echo "missing"
            fi
          done
          echo "diagnostic_mutation_count=0"
