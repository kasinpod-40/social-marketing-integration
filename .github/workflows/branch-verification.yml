name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_final_verify_and_lark_readback:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 20
    steps:
      - name: Verify exact completed run and read Lark targets
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="b92308ea649d0bed45c2ad893c1be2d4fef0592d"
          current_main="b78221af52ef8fc16fd92047fa5fae627f0e4d00"
          safe_api="$live_worktree/wrangler.api.google-ads-live-safe.jsonc"
          safe_sync="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"
          operator_evidence="$repo/outputs/google-ads-live-operator/paid-parity-20260822"
          final_evidence="$repo/outputs/google-ads-live-operator/paid-parity-final-verify-20260822"
          run_id="9e24aaa3-6939-486a-ad87-0527a088a6b7"
          mkdir -p "$final_evidence"
          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$current_main"
          git -C "$repo" merge-base --is-ancestor "$expected_sha" origin/main
          unexpected="$(git -C "$repo" diff --name-only "$expected_sha"..origin/main | grep -vE '^(\.dev\.vars\.example|docs/current-task\.md|tests/config/example-config-completeness\.test\.js|wrangler\.sync\.example\.jsonc)$' || true)"
          test -z "$unexpected"
          echo "newer_main_runtime_diff_count=0"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test -z "$(git -C "$live_worktree" status --porcelain --untracked-files=all)"
          test -f "$safe_api" && test -f "$safe_sync" && test -f "$operator_evidence/live-ready.json"

          SAFE_API="$safe_api" SAFE_SYNC="$safe_sync" node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync(process.env.SAFE_API,'utf8'));
          const s=JSON.parse(fs.readFileSync(process.env.SAFE_SYNC,'utf8'));
          const keys=['MKT_CONNECTOR_GOOGLE_ADS_ENABLED','MKT_GOOGLE_ADS_SIGNED_INGRESS_ENABLED','MKT_GOOGLE_ADS_QUEUE_ADMISSION_ENABLED','MKT_GOOGLE_ADS_BUSINESS_WRITE_ENABLED','MKT_GOOGLE_ADS_LARK_WRITE_ENABLED','MKT_SCHEDULE_GOOGLE_ADS_ENABLED'];
          if(!keys.every(k=>a.vars?.[k]==='false')||!keys.every(k=>s.vars?.[k]==='false'))throw new Error('safe_flags_not_false');
          console.log('safe_flags_false_both_configs=true');
          console.log('google_schedule_enabled=false');
          NODE

          cd "$live_worktree"
          env -u CI -u GITHUB_ACTIONS RUN_ID="$run_id" PRIMARY_REPO="$repo" LIVE_WORKTREE="$live_worktree" SAFE_API="$safe_api" SAFE_SYNC="$safe_sync" OPERATOR_EVIDENCE="$operator_evidence" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { resolve } from 'node:path';
          import { readDevVars } from './scripts/lib/dev-vars.js';
          const sync=JSON.parse(await readFile(process.env.SAFE_SYNC,'utf8'));
          const db=(sync.d1_databases??[]).find(x=>x?.binding==='MKT_STATE_DB');
          const manager=String(sync.vars?.MKT_GOOGLE_ADS_MANAGER_CUSTOMER_ID??'').replace(/-/gu,'').trim();
          const advertiser=String(sync.vars?.MKT_GOOGLE_ADS_ADVERTISER_CUSTOMER_ID??'').replace(/-/gu,'').trim();
          const devVars=await readDevVars(resolve(process.env.PRIMARY_REPO,'.dev.vars'));
          const baseEnv={...process.env,...devVars,MKT_ENV:'development',MKT_CUSTOMER_PROFILE:'integration_workspace',MKT_CONNECTION_CUSTOMER_KEY:'chemistry_k',MKT_GOOGLE_ADS_SOURCE_TIMEZONE:'Asia/Bangkok',MKT_GOOGLE_ADS_LIVE_DATABASE_NAME:db.database_name,MKT_GOOGLE_ADS_LIVE_API_WRANGLER_CONFIG:process.env.SAFE_API,MKT_GOOGLE_ADS_LIVE_SYNC_WRANGLER_CONFIG:process.env.SAFE_SYNC,MKT_GOOGLE_ADS_MANAGER_CUSTOMER_ID:manager,MKT_GOOGLE_ADS_ADVERTISER_CUSTOMER_ID:advertiser,MKT_GOOGLE_ADS_LIVE_EVIDENCE_DIR:process.env.OPERATOR_EVIDENCE,MKT_GOOGLE_ADS_LIVE_RUN_ID:process.env.RUN_ID};
          let r=spawnSync(process.execPath,['scripts/google-ads-live-operator.mjs','--phase=verify','--execute'],{cwd:process.env.LIVE_WORKTREE,env:{...baseEnv,CONFIRM_GOOGLE_ADS_LIVE_VERIFY:'verify'},encoding:'utf8',maxBuffer:32*1024*1024});
          process.stdout.write(r.stdout||''); if(r.status!==0){process.stderr.write(r.stderr||'');process.exit(r.status||1);}
          r=spawnSync(process.execPath,['scripts/google-ads-live-operator.mjs','--phase=rerun-verify','--execute'],{cwd:process.env.LIVE_WORKTREE,env:{...baseEnv,CONFIRM_GOOGLE_ADS_LIVE_RERUN_VERIFY:'rerun-verify'},encoding:'utf8',maxBuffer:32*1024*1024});
          process.stdout.write(r.stdout||''); if(r.status!==0){process.stderr.write(r.stderr||'');process.exit(r.status||1);}
          console.log('operator_verify=passed');
          console.log('operator_rerun_verify=passed');
          NODE

          env -u CI -u GITHUB_ACTIONS PRIMARY_REPO="$repo" SAFE_SYNC="$safe_sync" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { readDevVars } from './scripts/lib/dev-vars.js';
          import { createLarkBitableClientFromEnv } from './packages/connectors/src/lark/lark-bitable.client.js';
          import { readLarkTableIdsFromEnv } from './packages/config/src/lark-table-config.js';
          const devVars=await readDevVars(resolve(process.env.PRIMARY_REPO,'.dev.vars'));
          const safe=JSON.parse(await readFile(process.env.SAFE_SYNC,'utf8'));
          const env={...devVars,...safe.vars};
          const tableIds=readLarkTableIdsFromEnv(env,['mktAdsCreatives','mktAdsDaily','mktAdsAssetGroups']);
          const client=createLarkBitableClientFromEnv(env);
          const specs=[
            ['mktAdsCreatives','ads_creative_key',161],
            ['mktAdsDaily','ads_daily_key',200],
            ['mktAdsAssetGroups','ads_asset_group_key',0],
          ];
          for(const [key,field,minimum] of specs){
            const rows=await client.listRecords({tableId:tableIds[key],pageSize:500,includeRecordMetadata:false});
            const values=rows.map(r=>String(r.fields?.[field]??'').trim()).filter(Boolean);
            const googleValues=values.filter(v=>v.startsWith('google_ads:'));
            const unique=new Set(googleValues);
            if(unique.size!==googleValues.length) throw new Error(`${key}_duplicate_stable_key`);
            if(unique.size<minimum) throw new Error(`${key}_google_rows_below_reconciled_minimum:${unique.size}<${minimum}`);
            console.log(`${key}_physical_rows=${rows.length}`);
            console.log(`${key}_google_ads_unique_keys=${unique.size}`);
            console.log(`${key}_duplicate_google_ads_keys=0`);
          }
          console.log('lark_target_readback=passed');
          NODE

          database_name="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(c.d1_databases.find(x=>x.binding==="MKT_STATE_DB").database_name)' "$safe_sync")"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT r.mode,r.expected_chunk_count,r.received_chunk_count,r.expected_row_count,r.received_row_count,r.payload_redacted_at,a.status,a.last_error_code,a.completed_at,a.payload_redacted_at AS admission_redacted,a.reconciliation_json FROM google_ads_delivery_runs r JOIN google_ads_live_admissions a ON a.run_id=r.run_id WHERE r.run_id='$run_id';" --json > "$final_evidence/final-state.json"
          FINAL="$final_evidence/final-state.json" node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.FINAL,'utf8'));const a=Array.isArray(x)?x:[x];const r=a.flatMap(c=>c?.results??c?.result?.[0]?.results??[])[0];if(!r)throw new Error('final_run_missing');if(r.mode!=='LIVE'||+r.expected_chunk_count!==7||+r.received_chunk_count!==7||+r.expected_row_count!==1305||+r.received_row_count!==1305||r.status!=='completed'||r.last_error_code!==null||r.payload_redacted_at===null||r.admission_redacted===null)throw new Error('final_state_invalid');const rec=JSON.parse(r.reconciliation_json);const t=new Set(['mktAdsCreatives','mktAdsDaily','mktAdsAssetGroups']),rows=rec.lark.filter(v=>t.has(v.tableKey));if(rows.length!==3)throw new Error('target_reconciliation_missing');for(const v of rows){const n=+v.created+(+v.updated)+(+v.skipped);if(n!==+v.expected)throw new Error(`target_reconciliation_mismatch:${v.tableKey}`);console.log(`${v.tableKey}_expected=${v.expected}`);console.log(`${v.tableKey}_accounted=${n}`);}if(+rec.failed!==0)throw new Error('reconciliation_failed_nonzero');console.log(`reconciliation_failed=${rec.failed}`);console.log('payload_redacted=true');console.log('final_live_state=passed');
          NODE
          echo 'final_verify_remote_mutation_count=0'
