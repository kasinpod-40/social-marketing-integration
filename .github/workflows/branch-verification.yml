name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_live_run_read_only_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 8
    steps:
      - name: Inspect existing LIVE run without mutation
        shell: bash
        run: |
          set -euo pipefail
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="b92308ea649d0bed45c2ad893c1be2d4fef0592d"
          safe_sync="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"
          run_id="9e24aaa3-6939-486a-ad87-0527a088a6b7"
          evidence_root="$HOME/Git/social-marketing-integration/outputs/google-ads-live-operator/paid-parity-post-live-diagnostic-20260822"
          mkdir -p "$evidence_root"

          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test -f "$safe_sync"
          cd "$live_worktree"

          database_name="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const d=(c.d1_databases||[]).find(x=>x.binding==="MKT_STATE_DB");if(!d?.database_name)process.exit(1);process.stdout.write(d.database_name)' "$safe_sync")"

          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT * FROM google_ads_delivery_runs WHERE run_id='$run_id';" --json > "$evidence_root/run.json"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT * FROM google_ads_live_admissions WHERE run_id='$run_id';" --json > "$evidence_root/admission.json"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT dataset_key, COUNT(*) AS chunk_count, COALESCE(SUM(row_count),0) AS row_count FROM google_ads_delivery_chunks WHERE run_id='$run_id' GROUP BY dataset_key ORDER BY dataset_key;" --json > "$evidence_root/chunks.json"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name LIKE 'google_ads%' ORDER BY name;" --json > "$evidence_root/schema.json"

          RUN_FILE="$evidence_root/run.json" ADMISSION_FILE="$evidence_root/admission.json" CHUNKS_FILE="$evidence_root/chunks.json" SCHEMA_FILE="$evidence_root/schema.json" node <<'NODE'
          const fs=require('fs');
          const firstRow=(path)=>{
            const parsed=JSON.parse(fs.readFileSync(path,'utf8'));
            const cs=Array.isArray(parsed)?parsed:[parsed];
            for(const c of cs){const rows=c?.results??c?.result?.[0]?.results;if(Array.isArray(rows)&&rows.length)return rows[0];}
            return null;
          };
          const allRows=(path)=>{
            const parsed=JSON.parse(fs.readFileSync(path,'utf8'));
            const cs=Array.isArray(parsed)?parsed:[parsed];
            const out=[];
            for(const c of cs){const rows=c?.results??c?.result?.[0]?.results;if(Array.isArray(rows))out.push(...rows);}
            return out;
          };
          const run=firstRow(process.env.RUN_FILE);
          const admission=firstRow(process.env.ADMISSION_FILE);
          const chunks=allRows(process.env.CHUNKS_FILE);
          const schema=allRows(process.env.SCHEMA_FILE);
          if(!run) throw new Error('run_missing');
          console.log(`run_id=${run.run_id}`);
          console.log(`run_mode=${run.mode}`);
          console.log(`expected_chunks=${run.expected_chunk_count}`);
          console.log(`received_chunks=${run.received_chunk_count}`);
          console.log(`expected_rows=${run.expected_row_count}`);
          console.log(`received_rows=${run.received_row_count}`);
          console.log(`delivery_status=${run.status??''}`);
          if(admission){
            console.log(`admission_status=${admission.status??''}`);
            console.log(`last_error_code=${admission.last_error_code??''}`);
            console.log(`last_error_message=${String(admission.last_error_message??'').slice(0,500)}`);
            console.log(`admission_attempt_count=${admission.attempt_count??admission.attempts??''}`);
            console.log(`admission_updated_at=${admission.updated_at??''}`);
            console.log(`admission_completed_at=${admission.completed_at??''}`);
            let rec={};
            try{rec=JSON.parse(String(admission.reconciliation_json??'{}'));}catch{}
            const targets=new Set(['mktAdsCreatives','mktAdsDaily','mktAdsAssetGroups']);
            const lark=Array.isArray(rec.lark)?rec.lark:[];
            for(const x of lark.filter(x=>targets.has(x?.tableKey))){
              const accounted=Number(x.created??0)+Number(x.updated??0)+Number(x.skipped??0);
              console.log(`${x.tableKey}_expected=${x.expected}`);
              console.log(`${x.tableKey}_created=${x.created??0}`);
              console.log(`${x.tableKey}_updated=${x.updated??0}`);
              console.log(`${x.tableKey}_skipped=${x.skipped??0}`);
              console.log(`${x.tableKey}_accounted=${accounted}`);
            }
            console.log(`reconciliation_failed=${rec.failed??''}`);
          } else {
            console.log('admission_missing=true');
          }
          for(const x of chunks) console.log(`chunk_${x.dataset_key}=${x.chunk_count}/${x.row_count}`);
          console.log(`google_ads_schema_tables=${schema.map(x=>x.name).join(',')}`);
          console.log('diagnostic_remote_mutation_count=0');
          NODE
