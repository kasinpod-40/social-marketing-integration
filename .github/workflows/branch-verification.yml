name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_safe_api_error_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 5
    steps:
      - name: Read safe API deploy error
        shell: bash
        run: |
          set -euo pipefail
          path="$HOME/Git/social-marketing-integration/outputs/google-ads-live-operator/wrangler-oauth-recovery-20260822/api-safe.txt"
          test -f "$path"
          tail -n 160 "$path" \
            | sed -E 's/(token|secret|password|signature|authorization)[=: ]+[^ ]+/\1=<REDACTED>/Ig'
          echo "diagnostic_mutation_count=0"
