name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_assetgroups_fix_focused_test:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Run focused migration regression from PR 674 head
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          expected_sha="9a99beabb6fb7dffc3097cff69992cee06b7ba1a"
          test_worktree="/private/tmp/google-ads-assetgroups-transport-fix-test-20260822"

          git -C "$repo" fetch origin fix/google-ads-assetgroups-transport-schema
          test "$(git -C "$repo" rev-parse origin/fix/google-ads-assetgroups-transport-schema)" = "$expected_sha"

          if git -C "$repo" worktree list --porcelain | grep -Fxq "worktree $test_worktree"; then
            git -C "$repo" worktree remove --force "$test_worktree"
          fi
          rm -rf "$test_worktree"
          git -C "$repo" worktree add --detach "$test_worktree" "$expected_sha"
          trap 'git -C "$repo" worktree remove --force "$test_worktree" >/dev/null 2>&1 || true' EXIT

          cd "$test_worktree"
          node --test tests/storage/google-ads-assetgroups-transport-migration.test.js
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "focused_migration_test=passed"
          echo "tested_head=$expected_sha"
          echo "remote_mutation_count=0"
