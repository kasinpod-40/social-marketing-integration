name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_assetgroups_inventory:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Resolve Asset Groups inventory structure without values
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"

          PRIMARY_REPO="$repo" LIVE_WORKTREE="$live_worktree" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const repo = process.env.PRIMARY_REPO;
          const live = process.env.LIVE_WORKTREE;
          const inventory = path.join(repo, 'outputs/lark-native-ai-remote-inventory/inventory-summary.json');
          if (!fs.existsSync(inventory)) {
            console.error('inventory_missing=true');
            process.exit(1);
          }
          const root = JSON.parse(fs.readFileSync(inventory, 'utf8'));
          const matches = [];
          const seen = new Set();
          function walk(value, where = '$') {
            if (!value || typeof value !== 'object' || seen.has(value)) return;
            seen.add(value);
            if (Array.isArray(value)) {
              value.forEach((item, i) => walk(item, `${where}[${i}]`));
              return;
            }
            const values = Object.values(value);
            if (values.some((v) => typeof v === 'string' && v === 'MKT_Ads_AssetGroups')) {
              matches.push({ where, value });
            }
            for (const [k, v] of Object.entries(value)) walk(v, `${where}.${k}`);
          }
          walk(root);
          console.log(`assetgroups_inventory_object_count=${matches.length}`);
          let validTableIdField = false;
          for (const match of matches) {
            const fields = Object.entries(match.value).map(([k,v]) => ({
              key:k,
              type:Array.isArray(v)?'array':v===null?'null':typeof v,
              looksTableId:typeof v==='string' && /^tbl[A-Za-z0-9]+$/u.test(v),
              isTitle: v === 'MKT_Ads_AssetGroups',
            }));
            console.log(`object_path=${match.where}`);
            console.log(`object_fields=${fields.map((f)=>`${f.key}:${f.type}:tableId=${f.looksTableId}:title=${f.isTitle}`).join(',')}`);
            if (fields.some((f) => f.looksTableId)) validTableIdField = true;
          }
          console.log(`assetgroups_inventory_has_table_id=${validTableIdField}`);

          for (const candidate of ['wrangler.api.google-ads-live-safe.jsonc','wrangler.sync.google-ads-live-safe.jsonc']) {
            const r = spawnSync('git', ['-C', live, 'check-ignore', '-q', candidate]);
            console.log(`safe_config_candidate=${candidate} ignored=${r.status === 0}`);
          }
          NODE
