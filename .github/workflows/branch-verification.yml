name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_post_login_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 5
    steps:
      - name: Inspect latest Cloudflare and deploy evidence
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          safe_api="$live_worktree/wrangler.api.google-ads-live-safe.jsonc"
          safe_sync="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"
          evidence_root="$repo/outputs/google-ads-live-operator/paid-parity-manual-live-final-20260822"
          cd "$live_worktree"

          target_account_id="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));if(!a.account_id||a.account_id!==s.account_id)process.exit(1);process.stdout.write(a.account_id)' "$safe_api" "$safe_sync")"
          env -u CI -u GITHUB_ACTIONS npx wrangler whoami > "$evidence_root/whoami-now.txt" 2>&1 || true
          if grep -Fq "$target_account_id" "$evidence_root/whoami-now.txt"; then
            echo "target_account_visible=true"
          else
            echo "target_account_visible=false"
          fi

          for file in whoami-now.txt api-safe.txt sync-safe.txt api-active.txt sync-active.txt api-safe-final.txt sync-safe-final.txt; do
            path="$evidence_root/$file"
            echo "--- $file ---"
            if [ -f "$path" ]; then
              tail -n 100 "$path" | sed -E 's/(token|secret|password|signature|authorization)[=: ]+[^ ]+/\1=<REDACTED>/Ig'
            else
              echo "missing"
            fi
          done
          echo "diagnostic_mutation_count=0"
