name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_manager_script_inventory:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Locate current Manager Script artifact and safe contract markers
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test -z "$(git -C "$live_worktree" status --porcelain --untracked-files=all)"

          cd "$live_worktree"
          echo "--- filename_candidates ---"
          find . -type f \
            \( -iname '*google*ads*manager*' -o -iname '*manager*script*' -o -iname '*signed*delivery*' \) \
            -not -path './node_modules/*' -not -path './.git/*' | sort

          echo "--- current_contract_markers ---"
          rg -n --no-heading \
            'google_ads_manager_script_signed_delivery_v[234]|adsAssetGroups|assetGroups|SCHEMA_VERSION|schemaVersion|MODE|DRY_RUN|PREVIEW|LIVE|ScriptProperties|PropertiesService|runId' \
            . \
            -g '!node_modules/**' -g '!.git/**' \
            | grep -E 'google-ads|Google Ads|manager-script|Manager Script|signed-delivery' \
            | sed -E 's/(secret|token|signature|key)[[:space:]]*[:=][[:space:]]*[^,; ]+/\1=<REDACTED>/Ig' \
            | head -n 300
