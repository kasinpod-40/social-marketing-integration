name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_terminal_reason_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 8
    steps:
      - name: Inspect terminal reason and queue failure without mutation
        shell: bash
        run: |
          set -euo pipefail
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="b92308ea649d0bed45c2ad893c1be2d4fef0592d"
          safe_sync="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"
          run_id="9e24aaa3-6939-486a-ad87-0527a088a6b7"
          work_key="google_ads:$run_id"
          evidence_root="$HOME/Git/social-marketing-integration/outputs/google-ads-live-operator/paid-parity-terminal-diagnostic-20260822"
          mkdir -p "$evidence_root"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          cd "$live_worktree"
          database_name="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const d=(c.d1_databases||[]).find(x=>x.binding==="MKT_STATE_DB");process.stdout.write(d.database_name)' "$safe_sync")"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT work_key,cursor_key,lifecycle_status,terminal_reason,abandoned_at,audit_reference,updated_at,expires_at FROM sync_work_runs WHERE work_key='$work_key';" --json > "$evidence_root/work.json"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT lock_key,owner_id,expires_at,updated_at FROM sync_locks WHERE lock_key=(SELECT cursor_key FROM sync_work_runs WHERE work_key='$work_key');" --json > "$evidence_root/lock.json"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT dlq_id,message_id,queue_name,job_type,error_code,retry_count,status,created_at,updated_at FROM dead_letter_jobs WHERE payload_json LIKE '%$run_id%' OR replay_payload_json LIKE '%$run_id%' ORDER BY created_at DESC LIMIT 10;" --json > "$evidence_root/dlq.json"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT sync_run_id,status,retry_count,error_code,error_message,started_at,finished_at,updated_at FROM sync_runs WHERE platform='google_ads' AND started_at >= 1787389700000 ORDER BY started_at ASC;" --json > "$evidence_root/sync-runs.json"
          WORK="$evidence_root/work.json" LOCK="$evidence_root/lock.json" DLQ="$evidence_root/dlq.json" SYNCS="$evidence_root/sync-runs.json" node <<'NODE'
          const fs=require('fs');
          const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));const a=Array.isArray(x)?x:[x];return a.flatMap(c=>c?.results??c?.result?.[0]?.results??[])};
          const w=rows(process.env.WORK)[0];
          if(!w) throw new Error('work_missing');
          console.log(`lifecycle_status=${w.lifecycle_status}`);
          console.log(`terminal_reason=${w.terminal_reason??''}`);
          console.log(`abandoned_at=${w.abandoned_at??''}`);
          console.log(`audit_reference=${w.audit_reference??''}`);
          console.log(`cursor_key=${w.cursor_key}`);
          const locks=rows(process.env.LOCK); console.log(`lock_row_count=${locks.length}`); for(const x of locks) console.log(`lock=${x.owner_id}|${x.expires_at}`);
          const dlq=rows(process.env.DLQ); console.log(`matching_dlq_count=${dlq.length}`); for(const x of dlq) console.log(`dlq=${x.dlq_id}|${x.error_code}|${x.retry_count}|${x.status}`);
          const sr=rows(process.env.SYNCS); console.log(`google_ads_sync_run_count=${sr.length}`); for(const x of sr) console.log(`sync=${x.sync_run_id}|${x.status}|${x.retry_count}|${x.error_code??''}|${String(x.error_message??'').slice(0,180)}`);
          console.log('diagnostic_remote_mutation_count=0');
          NODE
