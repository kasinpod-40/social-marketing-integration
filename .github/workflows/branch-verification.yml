name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_ops_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Diagnose local worktree registrations
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          test -d "$repo/.git"
          git -C "$repo" fetch origin main
          actual_sha="$(git -C "$repo" rev-parse origin/main)"
          echo "origin_main_sha=$actual_sha"
          test "$actual_sha" = "$expected_sha"

          echo "--- worktree_list_begin ---"
          git -C "$repo" worktree list --porcelain
          echo "--- worktree_list_end ---"

          echo "--- prune_dry_run_begin ---"
          git -C "$repo" worktree prune --dry-run --expire now --verbose || true
          echo "--- prune_dry_run_end ---"

          echo "--- marker_status_begin ---"
          while IFS= read -r wt; do
            if [[ -e "$wt" ]]; then path_exists=true; else path_exists=false; fi
            if [[ -e "$wt/.git" ]]; then git_marker=true; else git_marker=false; fi
            echo "worktree_path=$wt path_exists=$path_exists git_marker=$git_marker"
          done < <(git -C "$repo" worktree list --porcelain | awk '/^worktree / { print substr($0,10) }')
          echo "--- marker_status_end ---"
