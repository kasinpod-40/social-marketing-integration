name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_config_resolution:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Resolve local live config candidates without secrets
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test "$(git -C "$live_worktree" branch --show-current)" = main
          test -z "$(git -C "$live_worktree" status --porcelain)"

          PRIMARY_REPO="$repo" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const repo = process.env.PRIMARY_REPO;
          const files = fs.readdirSync(repo)
            .filter((name) => /^wrangler.*\.jsonc?$/u.test(name))
            .sort();

          console.log(`wrangler_candidate_count=${files.length}`);
          for (const name of files) {
            const full = path.join(repo, name);
            const text = fs.readFileSync(full, 'utf8');
            const hasStateDb = /["']?binding["']?\s*:\s*["']MKT_STATE_DB["']/u.test(text);
            const hasQueue = /["']?binding["']?\s*:\s*["']MKT_SYNC_QUEUE["']/u.test(text);
            const hasManager = /["']?MKT_GOOGLE_ADS_MANAGER_CUSTOMER_ID["']?\s*:/u.test(text);
            const hasAdvertiser = /["']?MKT_GOOGLE_ADS_ADVERTISER_CUSTOMER_ID["']?\s*:/u.test(text);
            const hasDbName = /["']?database_name["']?\s*:\s*["'][^"']+["']/u.test(text);
            const main = text.match(/["']?main["']?\s*:\s*["']([^"']+)["']/u)?.[1] ?? '';
            const workerName = text.match(/["']?name["']?\s*:\s*["']([^"']+)["']/u)?.[1] ?? '';
            const falseFlags = [
              'MKT_CONNECTOR_GOOGLE_ADS_ENABLED',
              'MKT_GOOGLE_ADS_SIGNED_INGRESS_ENABLED',
              'MKT_GOOGLE_ADS_QUEUE_ADMISSION_ENABLED',
              'MKT_GOOGLE_ADS_BUSINESS_WRITE_ENABLED',
              'MKT_GOOGLE_ADS_LARK_WRITE_ENABLED',
              'MKT_SCHEDULE_GOOGLE_ADS_ENABLED',
            ];
            const flagsFalse = falseFlags.every((key) => new RegExp(`["']?${key}["']?\\s*:\\s*["']false["']`, 'u').test(text));
            console.log([
              `candidate=${name}`,
              `worker=${workerName || 'unknown'}`,
              `main=${main || 'unknown'}`,
              `state_db=${hasStateDb}`,
              `queue=${hasQueue}`,
              `db_name=${hasDbName}`,
              `manager_id_key=${hasManager}`,
              `advertiser_id_key=${hasAdvertiser}`,
              `google_flags_false=${flagsFalse}`,
            ].join(' '));
          }
          NODE
