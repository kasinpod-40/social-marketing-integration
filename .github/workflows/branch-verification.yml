name: Branch Verification

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax architecture and hygiene
        run: npm run check

      - name: Unit and Workers runtime tests
        run: npm test

      - name: Report reliability regression
        run: npm run test:report-reliability

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Wrangler dry run
        run: npm run deploy:dry-run
