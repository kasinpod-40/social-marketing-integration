name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_assetgroups_transport_post_migration_verify:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Verify applied 0021 from retained remote export
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="b92308ea649d0bed45c2ad893c1be2d4fef0592d"
          evidence_root="$repo/outputs/google-ads-live-operator/paid-parity-assetgroups-transport-20260822"
          after_export="$evidence_root/google-ads-after-0021.sql"
          sync_config="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"
          test -z "$(git -C "$live_worktree" status --porcelain --untracked-files=all)"
          test -s "$after_export"
          test -f "$sync_config"

          AFTER_EXPORT="$after_export" node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync(process.env.AFTER_EXPORT,'utf8');
          const create=/CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(?:"google_ads_delivery_chunks"|'google_ads_delivery_chunks'|`google_ads_delivery_chunks`|google_ads_delivery_chunks)\s*\(/iu.exec(text);
          if(!create){
            console.log('transport_table_schema_present=false');
            process.exit(1);
          }
          const start=create.index;
          const semicolon=text.indexOf(';',start);
          const ddl=text.slice(start,semicolon>start?semicolon+1:Math.min(text.length,start+12000));
          const supported=/['"]assetGroups['"]/.test(ddl);
          const oldSixOnly=!supported && /['"]campaignDailyMetrics['"]/.test(ddl);
          console.log('transport_table_schema_present=true');
          console.log(`assetgroups_dataset_constraint_supported=${supported}`);
          console.log(`historical_six_only_constraint=${oldSixOnly}`);
          console.log('remote_mutation_count=0');
          if(!supported) process.exit(2);
          NODE

          cd "$live_worktree"
          database_name="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const d=(c.d1_databases||[]).find(x=>x.binding==="MKT_STATE_DB");if(!d?.database_name)process.exit(1);process.stdout.write(d.database_name)' "$sync_config")"
          npx wrangler d1 migrations list "$database_name" --remote --config "$sync_config" > "$evidence_root/pending-final.txt"
          grep -Fq "No migrations to apply" "$evidence_root/pending-final.txt"
          echo "pending_migrations=0"
          echo "migration_0021_applied=true"
          echo "google_live_execute_count=0"
          echo "lark_write_count=0"
