name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_config_compare:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Compare exact local Google Ads configs without values
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          expected_sha="00dfd43c795a2b79dfa72ff1dc0514bc66b6eaae"

          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse origin/main)" = "$expected_sha"
          test "$(git -C "$live_worktree" rev-parse HEAD)" = "$expected_sha"

          PRIMARY_REPO="$repo" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const repo = process.env.PRIMARY_REPO;
          const names = [
            'wrangler.api.jsonc',
            'wrangler.sync.jsonc',
            'wrangler.api.google-ads-uat.jsonc',
            'wrangler.sync.google-ads-uat.jsonc',
          ];
          const flags = [
            'MKT_CONNECTOR_GOOGLE_ADS_ENABLED',
            'MKT_GOOGLE_ADS_SIGNED_INGRESS_ENABLED',
            'MKT_GOOGLE_ADS_QUEUE_ADMISSION_ENABLED',
            'MKT_GOOGLE_ADS_BUSINESS_WRITE_ENABLED',
            'MKT_GOOGLE_ADS_LARK_WRITE_ENABLED',
            'MKT_SCHEDULE_GOOGLE_ADS_ENABLED',
          ];

          const texts = Object.fromEntries(names.map((name) => [name, fs.readFileSync(path.join(repo, name), 'utf8')]));
          const extract = (text, key) => text.match(new RegExp(`["']?${key}["']?\\s*:\\s*["']([^"']*)["']`, 'u'))?.[1] ?? null;
          const hash = (value) => crypto.createHash('sha256').update(String(value ?? '')).digest('hex');

          for (const name of names) {
            const text = texts[name];
            console.log(`config=${name}`);
            for (const flag of flags) console.log(`  ${flag}=${extract(text, flag) ?? 'missing'}`);
            console.log(`  has_assetgroups_table=${/LARK_TABLE_MKT_ADS_ASSET_GROUPS/u.test(text)}`);
          }

          const pairs = [
            ['wrangler.api.jsonc', 'wrangler.api.google-ads-uat.jsonc'],
            ['wrangler.sync.jsonc', 'wrangler.sync.google-ads-uat.jsonc'],
            ['wrangler.api.google-ads-uat.jsonc', 'wrangler.sync.google-ads-uat.jsonc'],
          ];
          for (const [a, b] of pairs) {
            const keys = [
              'database_name',
              'database_id',
              'MKT_GOOGLE_ADS_MANAGER_CUSTOMER_ID',
              'MKT_GOOGLE_ADS_ADVERTISER_CUSTOMER_ID',
              'MKT_CONNECTION_CUSTOMER_KEY',
            ];
            console.log(`pair=${a}<->${b}`);
            for (const key of keys) {
              const av = extract(texts[a], key);
              const bv = extract(texts[b], key);
              console.log(`  ${key}_both_present=${Boolean(av && bv)} equal=${Boolean(av && bv && hash(av) === hash(bv))}`);
            }
          }
          NODE
