name: Branch Verification

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Final integration hotfixes use the repository-scoped Mac runner while hosted minutes are exhausted.
    runs-on: ${{ (github.event.pull_request.number == 308 || startsWith(github.head_ref, 'hotfix/chatwoot-final-') || startsWith(github.head_ref, 'hotfix/woocommerce-completed-state-incremental-admission-race') || startsWith(github.head_ref, 'hotfix/report-') || startsWith(github.head_ref, 'hotfix/meta-history-2026-')) && 'mkt-ci' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Finalize Chatwoot Secret subprocess isolation
        if: github.head_ref == 'hotfix/chatwoot-final-secret-staging'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          launcher = Path('scripts/chatwoot-final-30d-daily-uat-launcher.mjs')
          source = launcher.read_text()
          old_filter = "Object.entries(sourceEnv).filter(([name]) => !UNSAFE_TARGET_OVERRIDES.has(name)),"
          new_filter = "Object.entries(sourceEnv).filter(([name]) => !UNSAFE_TARGET_OVERRIDES.has(name)\n      && name !== 'CHATWOOT_API_ACCESS_TOKEN'),"
          if old_filter in source:
              source = source.replace(old_filter, new_filter, 1)
          elif new_filter not in source:
              raise SystemExit('subprocess Secret isolation anchor missing')

          old_deploy = "      '--secrets-file', secretFilePath,\n      '--message',"
          new_deploy = "      '--secrets-file', secretFilePath,\n      '--strict',\n      '--message',"
          if old_deploy in source:
              source = source.replace(old_deploy, new_deploy, 1)
          elif new_deploy not in source:
              raise SystemExit('strict Secret deployment anchor missing')
          launcher.write_text(source)

          test_file = Path('tests/application/chatwoot-final-secret-bootstrap-launcher.test.js')
          test_source = test_file.read_text()
          strict_old = "  assert.match(source, /--secrets-file/u);\n"
          strict_new = "  assert.match(source, /--secrets-file/u);\n  assert.match(source, /'--strict'/u);\n"
          if strict_new not in test_source:
              if strict_old not in test_source:
                  raise SystemExit('strict regression anchor missing')
              test_source = test_source.replace(strict_old, strict_new, 1)
          isolation_old = "  assert.match(source, /CHATWOOT_API_ACCESS_TOKEN/u);\n"
          isolation_new = "  assert.match(source, /CHATWOOT_API_ACCESS_TOKEN/u);\n  assert.match(source, /name !== 'CHATWOOT_API_ACCESS_TOKEN'/u);\n"
          if isolation_new not in test_source:
              if isolation_old not in test_source:
                  raise SystemExit('isolation regression anchor missing')
              test_source = test_source.replace(isolation_old, isolation_new, 1)
          test_file.write_text(test_source)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/chatwoot-final-30d-daily-uat-launcher.mjs tests/application/chatwoot-final-secret-bootstrap-launcher.test.js
          git commit -m "fix: isolate Chatwoot Secret during strict bootstrap deploy"
          git push origin HEAD:${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax architecture and hygiene
        run: npm run check

      - name: Focused Meta history finalizer tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/connectors/meta-history-range-adapters.test.js \
            tests/connectors/meta-business-source-adapters.test.js \
            tests/application/meta-history-2026-finalizer.test.js \
            tests/application/meta-history-2026-closeout.test.js \
            tests/application/meta-history-2026-public-launcher.test.js \
            tests/application/meta-history-2026-terminal.test.js \
            tests/application/meta-d1-only-rollout-operator.test.js \
            tests/application/meta-lark-parity-rollout-operator.test.js \
            2>&1 | tee focused-meta-history-test.log

      - name: Focused Woo completed-state race recovery tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/application/woocommerce-final-completed-state-closeout.test.js \
            tests/application/woocommerce-completed-state-incremental-admission-race.test.js \
            tests/application/woocommerce-final-rollout-operator.test.js \
            tests/application/woocommerce-runtime-wiring.test.js \
            2>&1 | tee focused-woocommerce-test.log

      - name: Focused Chatwoot final UAT tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/application/chatwoot-final-30d-daily-uat.test.js \
            tests/application/chatwoot-final-secret-bootstrap.test.js \
            tests/application/chatwoot-final-secret-bootstrap-launcher.test.js \
            tests/application/chatwoot-final-preflight-initialization.test.js \
            tests/application/chatwoot-final-queue-topology-normalization.test.js \
            tests/application/woocommerce-final-queue-bootstrap-auth-order.test.js \
            tests/application/chatwoot-final-lark-auto-mapping.test.js \
            tests/application/chatwoot-final-lock-scope.test.js \
            tests/application/chatwoot-runtime-wiring.test.js \
            tests/application/chatwoot-runtime-30d-daily.test.js \
            tests/application/chatwoot-runtime-contract-examples.test.js \
            tests/application/chatwoot-durable-recovery.test.js \
            2>&1 | tee focused-chatwoot-test.log

      - name: Focused staged TikTok tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/application/tiktok-staged-business-sync.test.js 2>&1 | tee focused-test.log

      - name: Unit and Workers runtime tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log

      - name: Report reliability regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:report-reliability 2>&1 | tee report-test.log

      - name: Dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee audit.log

      - name: Wrangler dry run
        run: npm run deploy:dry-run

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-verification-logs
          path: |
            *-test.log
            audit.log
          if-no-files-found: ignore
          retention-days: 7
