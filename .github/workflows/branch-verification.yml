name: Branch Verification

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply_chatwoot_snapshot_hotfix:
    if: github.head_ref == 'hotfix/chatwoot-final-d1-snapshot-file-preflight'
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-d1-snapshot-file-preflight
          fetch-depth: 0

      - name: Apply bounded D1 read correction
        shell: bash
        run: |
          if grep -Fq "'--file', sqlPath" scripts/chatwoot-final-30d-daily-uat.mjs; then
            echo 'Hotfix already applied.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/chatwoot-final-30d-daily-uat.mjs')
          source = source_path.read_text()

          old_preflight = """  const d1 = assertChatwootFinalUatPreflight(normalizeChatwootFinalUatPreflight(
            d1Row(target, buildChatwootFinalUatPreflightSql()),
          ));
          const lark = await larkCounts(target, true);
          """
          new_preflight = """  const d1 = assertChatwootFinalUatPreflight(normalizeChatwootFinalUatPreflight(
            d1Row(target, buildChatwootFinalUatPreflightSql()),
          ));
          d1Row(target, buildChatwootFinalUatSnapshotSql(target.session.initial));
          const lark = await larkCounts(target, true);
          """
          if source.count(old_preflight) != 1:
              raise SystemExit('unexpected preflight block count')
          source = source.replace(old_preflight, new_preflight, 1)

          old_return = """    requiredSecretNames: REQUIRED_SECRETS.length,
            d1,
            larkTableCount: CHATWOOT_FINAL_UAT_TABLES.length,
          """
          new_return = """    requiredSecretNames: REQUIRED_SECRETS.length,
            d1,
            snapshotSqlVerified: true,
            larkTableCount: CHATWOOT_FINAL_UAT_TABLES.length,
          """
          if source.count(old_return) != 1:
              raise SystemExit('unexpected preflight return count')
          source = source.replace(old_return, new_return, 1)

          old_d1 = """function d1Row(target, sql) {
            const parsed = JSON.parse(text('npx', ['wrangler', 'd1', 'execute', configName(target, 'databaseName'), '--remote', '--json',
              '--config', target.sourcePath, '--command', sql], { env: target.cf.env }));
            const row = Array.isArray(parsed) ? parsed.flatMap((item) => item.results ?? [])[0] : parsed.results?.[0];
            if (!row) fail('D1 query returned no row', 'CHATWOOT_FINAL_UAT_D1_EMPTY');
            return row;
          }
          """
          new_d1 = """function d1Row(target, sql) {
            const directory = inside(join('outputs', 'chatwoot-final-30d-daily-uat', '.generated'));
            execFileSync('mkdir', ['-p', directory]);
            const sqlPath = join(directory, `d1-read-${Date.now()}-${process.pid}-${process.hrtime.bigint()}.sql`);
            execFileSync('sh', ['-c', 'umask 077; cat > \"$1\"', 'sh', sqlPath], {
              input: `${String(sql).trim()}\\n`,
            });
            try {
              const parsed = JSON.parse(text('npx', ['wrangler', 'd1', 'execute', configName(target, 'databaseName'), '--remote', '--json',
                '--config', target.sourcePath, '--file', sqlPath], { env: target.cf.env }));
              const row = Array.isArray(parsed) ? parsed.flatMap((item) => item.results ?? [])[0] : parsed.results?.[0];
              if (!row) fail('D1 query returned no row', 'CHATWOOT_FINAL_UAT_D1_EMPTY');
              return row;
            } finally {
              try { execFileSync('rm', ['-f', sqlPath]); } catch {}
            }
          }
          """
          if source.count(old_d1) != 1:
              raise SystemExit('unexpected d1Row block count')
          source = source.replace(old_d1, new_d1, 1)

          old_error = """      command, exitCode: error?.status ?? null, stderrFingerprint: error?.stderr ? sha256(String(error.stderr)) : null,
          """
          new_error = """      command,
              exitCode: error?.status ?? null,
              stdoutFingerprint: error?.stdout ? sha256(String(error.stdout)) : null,
              stderrFingerprint: error?.stderr ? sha256(String(error.stderr)) : null,
          """
          if source.count(old_error) != 1:
              raise SystemExit('unexpected command error details count')
          source = source.replace(old_error, new_error, 1)
          source_path.write_text(source)

          final_test_path = Path('tests/application/chatwoot-final-30d-daily-uat.test.js')
          tests = final_test_path.read_text()
          marker = "test('D1 Snapshot reads use private files and are preflighted before Active deployment', async () => {"
          if marker not in tests:
              tests += r'''

test('D1 Snapshot reads use private files and are preflighted before Active deployment', async () => {
  const source = await readFile(
    new URL('../../scripts/chatwoot-final-30d-daily-uat.mjs', import.meta.url),
    'utf8',
  );
  assert.match(source, /d1Row\(target, buildChatwootFinalUatSnapshotSql\(target\.session\.initial\)\)/u);
  assert.match(source, /umask 077; cat > \\"\$1\\"/u);
  assert.match(source, /'--file', sqlPath/u);
  assert.match(source, /finally \{\s*try \{ execFileSync\('rm', \['-f', sqlPath\]\); \} catch \{\}/u);
  assert.match(source, /stdoutFingerprint: error\?\.stdout \? sha256\(String\(error\.stdout\)\) : null/u);
  assert.doesNotMatch(source, /'--command', sql/u);
});
'''
          final_test_path.write_text(tests)

          ordering_path = Path('tests/application/chatwoot-final-preflight-initialization.test.js')
          ordering = ordering_path.read_text()
          old_assertion = """  assert.match(source, /baselineVersion: preflightResult\\.activeVersion/u);
          });
          """
          new_assertion = """  assert.match(source, /baselineVersion: preflightResult\\.activeVersion/u);
            assert.match(source, /d1Row\\(target, buildChatwootFinalUatSnapshotSql\\(target\\.session\\.initial\\)\\)/u);
          });
          """
          if ordering.count(old_assertion) != 1:
              raise SystemExit('unexpected preflight assertion count')
          ordering = ordering.replace(old_assertion, new_assertion, 1)
          ordering_path.write_text(ordering)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/chatwoot-final-30d-daily-uat.mjs \
            tests/application/chatwoot-final-30d-daily-uat.test.js \
            tests/application/chatwoot-final-preflight-initialization.test.js
          git commit -m "fix: preflight Chatwoot D1 snapshots from private files"
          git push origin HEAD:hotfix/chatwoot-final-d1-snapshot-file-preflight

  verify:
    # Final integration hotfixes use the repository-scoped Mac runner while hosted minutes are exhausted.
    runs-on: ${{ (github.event.pull_request.number == 308 || startsWith(github.head_ref, 'hotfix/chatwoot-final-') || startsWith(github.head_ref, 'hotfix/woocommerce-completed-state-incremental-admission-race') || startsWith(github.head_ref, 'hotfix/report-') || startsWith(github.head_ref, 'hotfix/meta-history-2026-')) && 'mkt-ci' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax architecture and hygiene
        run: npm run check

      - name: Focused Meta history finalizer tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/connectors/meta-history-range-adapters.test.js \
            tests/connectors/meta-business-source-adapters.test.js \
            tests/application/meta-history-2026-finalizer.test.js \
            tests/application/meta-history-2026-closeout.test.js \
            tests/application/meta-history-2026-public-launcher.test.js \
            tests/application/meta-history-2026-terminal.test.js \
            tests/application/meta-d1-only-rollout-operator.test.js \
            tests/application/meta-lark-parity-rollout-operator.test.js \
            2>&1 | tee focused-meta-history-test.log

      - name: Focused Woo completed-state race recovery tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/application/woocommerce-final-completed-state-closeout.test.js \
            tests/application/woocommerce-completed-state-incremental-admission-race.test.js \
            tests/application/woocommerce-final-rollout-operator.test.js \
            tests/application/woocommerce-runtime-wiring.test.js \
            2>&1 | tee focused-woocommerce-test.log

      - name: Focused Chatwoot final UAT tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/application/chatwoot-final-30d-daily-uat.test.js \
            tests/application/chatwoot-final-secret-bootstrap.test.js \
            tests/application/chatwoot-final-secret-bootstrap-launcher.test.js \
            tests/application/chatwoot-final-preflight-initialization.test.js \
            tests/application/chatwoot-final-queue-topology-normalization.test.js \
            tests/application/woocommerce-final-queue-bootstrap-auth-order.test.js \
            tests/application/chatwoot-final-lark-auto-mapping.test.js \
            tests/application/chatwoot-final-lock-scope.test.js \
            tests/application/chatwoot-runtime-wiring.test.js \
            tests/application/chatwoot-runtime-30d-daily.test.js \
            tests/application/chatwoot-runtime-contract-examples.test.js \
            tests/application/chatwoot-durable-recovery.test.js \
            2>&1 | tee focused-chatwoot-test.log

      - name: Focused staged TikTok tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/application/tiktok-staged-business-sync.test.js 2>&1 | tee focused-test.log

      - name: Unit and Workers runtime tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log

      - name: Report reliability regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:report-reliability 2>&1 | tee report-test.log

      - name: Dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee audit.log

      - name: Wrangler dry run
        run: npm run deploy:dry-run

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-verification-logs
          path: |
            *-test.log
            audit.log
          if-no-files-found: ignore
          retention-days: 7
