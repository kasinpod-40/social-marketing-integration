name: Branch Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  google_ads_direct_recovery_failure_diagnostic:
    if: github.event.pull_request.number == 673
    runs-on: mkt-ci
    timeout-minutes: 8
    steps:
      - name: Inspect first direct recovery failure without mutation
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/Git/social-marketing-integration"
          live_worktree="/private/tmp/google-ads-paid-parity-live-closure-20260822"
          safe_sync="$live_worktree/wrangler.sync.google-ads-live-safe.jsonc"
          run_id="9e24aaa3-6939-486a-ad87-0527a088a6b7"
          work_key="google_ads:$run_id"
          evidence_root="$repo/outputs/google-ads-live-operator/paid-parity-direct-recovery-20260822"
          if [ -f "$evidence_root/recovery-1.json" ]; then
            echo '--- recovery response ---'
            cat "$evidence_root/recovery-1.json" | sed -E 's/(token|secret|password|authorization)[=: ]+[^ ]+/\1=<REDACTED>/Ig'
          fi
          if [ -f "$evidence_root/wrangler-dev.log" ]; then
            echo '--- wrangler dev tail ---'
            tail -n 160 "$evidence_root/wrangler-dev.log" | sed -E 's/(token|secret|password|authorization)[=: ]+[^ ]+/\1=<REDACTED>/Ig'
          fi
          cd "$live_worktree"
          database_name="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(c.d1_databases.find(x=>x.binding==="MKT_STATE_DB").database_name)' "$safe_sync")"
          env -u CI -u GITHUB_ACTIONS npx wrangler d1 execute "$database_name" --remote --config "$safe_sync" --command "SELECT w.lifecycle_status,w.terminal_reason,w.audit_reference,a.status AS admission_status,a.last_error_code,p.processed_items,p.expected_items,p.complete,p.state_json FROM sync_work_runs w JOIN google_ads_live_admissions a ON a.work_key=w.work_key LEFT JOIN sync_work_phases p ON p.work_key=w.work_key AND p.phase='google_ads_d1_business_write_v1' WHERE w.work_key='$work_key';" --json > "$evidence_root/post-failure-state.json"
          STATE="$evidence_root/post-failure-state.json" node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.STATE,'utf8'));const a=Array.isArray(x)?x:[x];const row=a.flatMap(c=>c?.results??c?.result?.[0]?.results??[])[0];if(!row)throw new Error('state_missing');let s={};try{s=JSON.parse(String(row.state_json??'{}'));}catch{}
          console.log(`lifecycle_status=${row.lifecycle_status}`);
          console.log(`terminal_reason=${row.terminal_reason??''}`);
          console.log(`audit_reference=${row.audit_reference??''}`);
          console.log(`admission_status=${row.admission_status}`);
          console.log(`last_error_code=${row.last_error_code??''}`);
          console.log(`d1_progress=${row.processed_items}/${row.expected_items}`);
          console.log(`d1_next_index=${s.nextIndex??''}`);
          console.log('diagnostic_remote_mutation_count=0');
          NODE
