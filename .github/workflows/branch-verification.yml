name: Branch Verification

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Final integration hotfixes use the repository-scoped Mac runner while hosted minutes are exhausted.
    runs-on: ${{ (github.event.pull_request.number == 308 || startsWith(github.head_ref, 'hotfix/chatwoot-final-') || startsWith(github.head_ref, 'hotfix/woocommerce-completed-state-incremental-admission-race') || startsWith(github.head_ref, 'hotfix/meta-history-2026-')) && 'mkt-ci' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax architecture and hygiene
        run: npm run check

      - name: Focused Meta history finalizer tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/connectors/meta-history-range-adapters.test.js \
            tests/application/meta-history-2026-finalizer.test.js \
            tests/application/meta-history-2026-closeout.test.js \
            tests/application/meta-d1-only-rollout-operator.test.js \
            tests/application/meta-lark-parity-rollout-operator.test.js \
            2>&1 | tee focused-meta-history-test.log

      - name: Focused Woo completed-state race recovery tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/application/woocommerce-final-completed-state-closeout.test.js \
            tests/application/woocommerce-completed-state-incremental-admission-race.test.js \
            tests/application/woocommerce-final-rollout-operator.test.js \
            tests/application/woocommerce-runtime-wiring.test.js \
            2>&1 | tee focused-woocommerce-test.log

      - name: Focused Chatwoot final UAT tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/application/chatwoot-final-30d-daily-uat.test.js \
            tests/application/chatwoot-final-preflight-initialization.test.js \
            tests/application/chatwoot-final-lark-auto-mapping.test.js \
            tests/application/chatwoot-final-lock-scope.test.js \
            tests/application/chatwoot-runtime-wiring.test.js \
            tests/application/chatwoot-runtime-30d-daily.test.js \
            tests/application/chatwoot-runtime-contract-examples.test.js \
            tests/application/chatwoot-durable-recovery.test.js \
            2>&1 | tee focused-chatwoot-test.log

      - name: Focused staged TikTok tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/application/tiktok-staged-business-sync.test.js 2>&1 | tee focused-test.log

      - name: Unit and Workers runtime tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log

      - name: Report reliability regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:report-reliability 2>&1 | tee report-test.log

      - name: Dependency audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee audit.log

      - name: Wrangler dry run
        run: npm run deploy:dry-run

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-verification-logs
          path: |
            *-test.log
            audit.log
          if-no-files-found: ignore
          retention-days: 7
