name: Meta Runtime Rebase Apply

on:
  push:
    branches:
      - agent/meta-runtime-wiring-rebased

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rebased branch
        uses: actions/checkout@v4
        with:
          ref: agent/meta-runtime-wiring-rebased
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore verified Meta wiring tree
        run: |
          git fetch origin b3dc97efb04e7349dc755a7ea55b2c171e18bf17
          git checkout b3dc97efb04e7349dc755a7ea55b2c171e18bf17 -- \
            .dev.vars.example \
            wrangler.sync.example.jsonc \
            apps/sync-worker/src/google-ads-active-job-router.js \
            apps/sync-worker/src/meta-active-job-router.js \
            apps/sync-worker/src/meta-end-to-end-job-router.js \
            docs/tasks/meta-runtime-wiring.md \
            packages/application/src/jobs/job-catalog.js \
            packages/application/src/jobs/queue-operation.js \
            packages/application/src/use-cases/process-meta-end-to-end-sync.js \
            packages/config/src/connector-runtime-config.js \
            packages/config/src/meta-end-to-end-runtime-config.js \
            packages/connectors/src/meta/meta-token-connection-runtime.js \
            tests/application/job-catalog.test.js \
            tests/application/meta-end-to-end-routing-and-report.test.js \
            tests/application/meta-runtime-wiring.test.js \
            tests/config/meta-runtime-wiring-config.test.js

      - name: Remove one-shot workflow
        run: rm .github/workflows/meta-runtime-rebase-apply.yml

      - name: Diff hygiene
        run: git diff --check

      - name: Syntax architecture and repository hygiene
        run: npm run check

      - name: Focused Meta runtime tests
        run: |
          node --test \
            tests/application/meta-end-to-end-source.test.js \
            tests/application/meta-organic-write-set.test.js \
            tests/application/meta-ads-write-set.test.js \
            tests/application/process-meta-end-to-end-generation.test.js \
            tests/application/meta-end-to-end-routing-and-report.test.js \
            tests/application/meta-runtime-wiring.test.js \
            tests/config/meta-runtime-wiring-config.test.js

      - name: Unit and Workers runtime tests
        run: npm test

      - name: Report reliability regression
        run: npm run test:report-reliability

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Wrangler dry run
        run: npm run deploy:dry-run

      - name: Commit verified rebased wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebase protected Meta runtime wiring"
          git push origin HEAD:agent/meta-runtime-wiring-rebased
