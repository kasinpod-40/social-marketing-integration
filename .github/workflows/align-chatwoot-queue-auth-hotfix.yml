name: Align Chatwoot Queue Auth Hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    if: github.head_ref == 'hotfix/chatwoot-final-queue-bootstrap-auth-order'
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-queue-bootstrap-auth-order
          fetch-depth: 0

      - name: Merge exact current main and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --quiet
          git merge --no-ff origin/main -m "merge: align Chatwoot Queue auth hotfix with main"
          git push origin HEAD:hotfix/chatwoot-final-queue-bootstrap-auth-order
