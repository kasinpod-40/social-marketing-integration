name: Report Runtime Validation Patch

on:
  pull_request:
    branches:
      - codex/report-multichannel-runtime

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout report runtime branch
        uses: actions/checkout@v4
        with:
          ref: codex/report-multichannel-runtime
          fetch-depth: 0

      - name: Apply validation fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wrangler = Path('wrangler.sync.example.jsonc')
          text = wrangler.read_text()
          anchor = '    "MKT_REPORT_PRESET_MATERIALIZATION_ENABLED": "false",\n'
          ai_flag = '    "MKT_REPORT_AI_SUMMARY_ENABLED": "false",\n'
          if ai_flag not in text:
              if anchor not in text:
                  raise SystemExit('wrangler storage flag anchor missing')
              wrangler.write_text(text.replace(anchor, anchor + ai_flag, 1))

          test_file = Path('tests/application/reconcile-dashboard-report-settings.test.js')
          test_text = test_file.read_text()
          import_anchor = "import { TableSyncEngine } from '../../packages/sync-engine/src/table-sync-engine.js';\n"
          expanded_import = import_anchor + "import { DASHBOARD_REPORT_PLATFORM_SCOPES } from '../../packages/config/src/report-settings.seed.js';\n\nconst EXPECTED_CANONICAL_COUNT = 2 + (DASHBOARD_REPORT_PLATFORM_SCOPES.length * 7);\n"
          if 'EXPECTED_CANONICAL_COUNT' not in test_text:
              if import_anchor not in test_text:
                  raise SystemExit('reconciliation test import anchor missing')
              test_text = test_text.replace(import_anchor, expanded_import, 1)
          test_text = test_text.replace(
              '    canonicalExpected: 9,\n    canonicalCreates: 9,',
              '    canonicalExpected: EXPECTED_CANONICAL_COUNT,\n    canonicalCreates: EXPECTED_CANONICAL_COUNT,',
              1,
          )
          test_text = test_text.replace(
              '  assert.equal(result.canonical.created, 9);',
              '  assert.equal(result.canonical.created, EXPECTED_CANONICAL_COUNT);',
              1,
          )
          test_text = test_text.replace(
              '  assert.equal(result.verification.canonicalActive, 9);',
              '  assert.equal(result.verification.canonicalActive, EXPECTED_CANONICAL_COUNT);',
              1,
          )
          test_file.write_text(test_text)
          PY
          git diff --check

      - name: Commit validation fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.sync.example.jsonc tests/application/reconcile-dashboard-report-settings.test.js
          git commit -m 'fix: close multichannel report validation gaps'
          git push origin HEAD:codex/report-multichannel-runtime
