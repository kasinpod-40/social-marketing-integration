name: Report Runtime Source Export

on:
  pull_request:
    branches:
      - codex/report-multichannel-runtime

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package source checkout
        run: tar --exclude=.git -czf /tmp/report-runtime-source.tgz .

      - name: Upload source checkout
        uses: actions/upload-artifact@v4
        with:
          name: report-runtime-source
          path: /tmp/report-runtime-source.tgz
          if-no-files-found: error
          retention-days: 1
