name: Apply Chatwoot Queue Topology Hotfix

on:
  push:
    branches:
      - hotfix/chatwoot-final-queue-topology-normalization

permissions:
  contents: write

jobs:
  apply:
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-queue-topology-normalization
          fetch-depth: 0

      - name: Apply exact guarded source and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          operator = Path('scripts/chatwoot-final-30d-daily-uat.mjs')
          source = operator.read_text()

          import_anchor = "} from './lib/woocommerce-final-one-command.js';\n"
          import_line = "import { assertWooCommerceQueueConsumerTopology } from './lib/woocommerce-queue-consumer-topology.js';\n"
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('operator import anchor mismatch')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old_assert = """function assertQueue(target, queueName, expected) {
            const value = JSON.parse(text('npx', ['wrangler', 'queues', 'consumer', 'list', queueName, '--json'], { env: target.cf.env }));
            const items = Array.isArray(value) ? value : value.result ?? value.consumers ?? [];
            if (items.length !== 1) fail('Queue consumer topology is ambiguous', 'CHATWOOT_FINAL_UAT_QUEUE_TOPOLOGY_INVALID', { queueName });
            const settings = items[0].settings ?? items[0];
            const observed = { maxConcurrency: Number(settings.max_concurrency), maxBatchSize: Number(settings.max_batch_size),
              maxBatchTimeout: Number(settings.max_batch_timeout), maxRetries: Number(settings.max_retries),
              deadLetterQueue: textOrNull(settings.dead_letter_queue ?? items[0].dead_letter_queue) };
            if (stableJson(observed) !== stableJson(expected)) fail('Queue topology differs', 'CHATWOOT_FINAL_UAT_QUEUE_TOPOLOGY_INVALID', { queueName, observed });
          }
          """
          new_assert = """function assertQueue(target, queueName, expected) {
            const value = JSON.parse(text('npx', ['wrangler', 'queues', 'consumer', 'list', queueName, '--json'], { env: target.cf.env }));
            const items = Array.isArray(value) ? value : value.result ?? value.consumers ?? [];
            try {
              return assertWooCommerceQueueConsumerTopology(items, queueName, expected);
            } catch (error) {
              fail('Queue topology differs', 'CHATWOOT_FINAL_UAT_QUEUE_TOPOLOGY_INVALID', {
                queueName,
                field: error?.details?.field ?? null,
                observed: error?.details?.observed ?? null,
                expected: error?.details?.expected ?? null,
                causeCode: error?.code ?? null,
              });
            }
          }
          """
          if new_assert not in source:
              if source.count(old_assert) != 1:
                  raise SystemExit('operator assertQueue anchor mismatch')
              source = source.replace(old_assert, new_assert, 1)

          obsolete = "function textOrNull(value) { return typeof value === 'string' && value.trim() ? value.trim() : null; }\n"
          if obsolete in source:
              source = source.replace(obsolete, '', 1)

          operator.write_text(source)

          test_path = Path('tests/application/chatwoot-final-queue-topology-normalization.test.js')
          test_path.write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import { assertWooCommerceQueueConsumerTopology } from '../../scripts/lib/woocommerce-queue-consumer-topology.js';

          const expected = Object.freeze({
            maxConcurrency: 1,
            maxBatchSize: 10,
            maxBatchTimeout: 30,
            maxRetries: 5,
            deadLetterQueue: 'social-mkt-sync-dlq',
          });

          test('shared Queue topology validator accepts current Wrangler consumer aliases', () => {
            const observed = assertWooCommerceQueueConsumerTopology([
              {
                queue_name: 'social-mkt-sync-jobs',
                settings: {
                  max_concurrency: 1,
                  batch_size: 10,
                  max_wait_time_ms: 30_000,
                  max_retries: 5,
                  dead_letter_queue: 'social-mkt-sync-dlq',
                },
              },
            ], 'social-mkt-sync-jobs', expected);
            assert.deepEqual(observed, expected);
          });

          test('shared Queue topology validator retains legacy Wrangler aliases', () => {
            const observed = assertWooCommerceQueueConsumerTopology([
              {
                queue_name: 'social-mkt-sync-jobs',
                max_concurrency: 1,
                max_batch_size: 10,
                max_batch_timeout: 30,
                max_retries: 5,
                dead_letter_queue: 'social-mkt-sync-dlq',
              },
            ], 'social-mkt-sync-jobs', expected);
            assert.deepEqual(observed, expected);
          });

          test('Chatwoot Final operator reuses the shared Queue topology authority', async () => {
            const source = await readFile(
              new URL('../../scripts/chatwoot-final-30d-daily-uat.mjs', import.meta.url),
              'utf8',
            );
            assert.match(source, /assertWooCommerceQueueConsumerTopology/u);
            assert.match(source, /return assertWooCommerceQueueConsumerTopology\(items, queueName, expected\)/u);
            assert.doesNotMatch(source, /Number\(settings\.max_batch_size\)/u);
            assert.doesNotMatch(source, /Number\(settings\.max_batch_timeout\)/u);
          });
          """.replace('          ', ''))

          workflow = Path('.github/workflows/branch-verification.yml')
          workflow_text = workflow.read_text()
          test_line = '            tests/application/chatwoot-final-queue-topology-normalization.test.js \\\n'
          anchor = '            tests/application/chatwoot-final-preflight-initialization.test.js \\\n'
          if test_line not in workflow_text:
              if workflow_text.count(anchor) != 1:
                  raise SystemExit('branch verification anchor mismatch')
              workflow_text = workflow_text.replace(anchor, anchor + test_line, 1)
              workflow.write_text(workflow_text)

          task = Path('docs/tasks/chatwoot-final-queue-topology-normalization-hotfix.md')
          task.write_text("""# Chatwoot Final Queue Topology Normalization Hotfix

## Incident

The guarded Chatwoot Final UAT passed local gates, Lark table mapping and Queue identity discovery, then stopped during read-only Queue topology validation. Wrangler returned current consumer aliases `batch_size` and `max_wait_time_ms`, while the Chatwoot operator read only legacy `max_batch_size` and `max_batch_timeout`. The resulting `null` values caused a false topology drift decision.

```text
safeRestore = NOT_REQUIRED
production  = BLOCKED
```

No temporary Active Worker deployment, Queue message, D1/Lark Business write or Chatwoot Provider request occurred.

## Correction

- Reuse `assertWooCommerceQueueConsumerTopology()` as the shared Queue topology authority.
- Accept reviewed modern aliases `batch_size` and `max_wait_time_ms` and retained legacy aliases.
- Convert millisecond wait time to exact whole seconds.
- Fail closed when aliases disagree, fields are missing, consumer identity is ambiguous or values differ.
- Preserve Chatwoot public error code and redact raw Queue inventory.
- Do not change Queue configuration, Worker flags, Schedule, Webhook or Production.

## Validation

```text
npm ci
npm run check
focused Chatwoot Final/Lark/Queue/runtime/recovery tests
focused TikTok staged regression
npm test
npm run test:report-reliability
npm audit --audit-level=high
npm run deploy:dry-run
exact-head Branch Verification
```

`docs/current-task.md` remains owned by the concurrent Meta workstream and is intentionally unchanged.
""")

          brain = Path('docs/project-brain/chatwoot-final-queue-topology-normalization-hotfix-2026-07-31.md')
          brain.write_text("""# Project Brain — Chatwoot Final Queue Topology Normalization Hotfix

## Decision

Chatwoot Final UAT must use the existing shared WooCommerce Queue consumer topology normalizer. Wrangler's current output uses `batch_size` and `max_wait_time_ms`; legacy output may use `max_batch_size` and `max_batch_timeout`. Both are valid only when they resolve to the same exact reviewed topology.

## Incident boundary

The failed attempt stopped during read-only Queue topology inspection before D1 backup and before any Active Worker deployment. `safeRestore=NOT_REQUIRED` is authoritative. Queue submission, Provider access and D1/Lark Business mutation counts are zero.

## Shared authority

```text
wrangler queues consumer list --json
→ extract bounded consumer array
→ assertWooCommerceQueueConsumerTopology
→ resolve modern/legacy aliases
→ exact topology comparison
→ continue read-only preflight
```

Modern `max_wait_time_ms` must divide evenly by 1000. Conflicting aliases, missing fields, duplicate consumers or topology drift remain fail-closed.

## Safety

```text
Remote Provider request       0 during hotfix
Remote D1/Lark action         0 during hotfix
Queue/DLQ message             0 during hotfix
Worker deployment             0 during hotfix
Schedule/Webhook              disabled
Production                    blocked
```
""")

          changelog = Path('CHANGELOG-CHATWOOT-FINAL-UAT.md')
          changelog_text = changelog.read_text()
          heading = '# Chatwoot Final UAT Changelog\n'
          section = """

## Unreleased — Queue Topology Normalization Hotfix

- Fixed false Queue drift when current Wrangler emits `batch_size` and `max_wait_time_ms` instead of legacy aliases.
- Chatwoot Final UAT now reuses the shared WooCommerce Queue consumer topology validator.
- Modern and legacy aliases remain fail-closed when missing, conflicting, ambiguous or different from the reviewed Queue contract.
- The failed live attempt stopped before D1 backup, Active deployment, Queue send, Provider access or D1/Lark Business writes; Safe restore was not required.
"""
          if '## Unreleased — Queue Topology Normalization Hotfix' not in changelog_text:
              if changelog_text.count(heading) != 1:
                  raise SystemExit('changelog heading mismatch')
              changelog.write_text(changelog_text.replace(heading, heading + section, 1))
          PY

      - name: Remove temporary apply workflow
        run: git rm .github/workflows/apply-chatwoot-queue-topology-hotfix.yml

      - name: Commit exact hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/chatwoot-final-30d-daily-uat.mjs \
            tests/application/chatwoot-final-queue-topology-normalization.test.js \
            .github/workflows/branch-verification.yml \
            CHANGELOG-CHATWOOT-FINAL-UAT.md \
            docs/tasks/chatwoot-final-queue-topology-normalization-hotfix.md \
            docs/project-brain/chatwoot-final-queue-topology-normalization-hotfix-2026-07-31.md
          git commit -m "fix: normalize Chatwoot Queue topology output"
          git push origin HEAD:hotfix/chatwoot-final-queue-topology-normalization
