name: ChatGPT UAT Documentation Closeout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: chatgpt-uat-doc-closeout
  cancel-in-progress: false

jobs:
  update-docs:
    if: github.head_ref == 'work/customer-real-uat-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/customer-real-uat-foundation
          fetch-depth: 0

      - name: Update current documentation without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f'marker not found in {path}')
              file.write_text(text.replace(old, new, 1))
              return True

          changed = False

          changed |= replace_once(
              'PROJECT_BRAIN.md',
              """Official clean baseline: `v0.10.2-multi-channel-foundation-approved`

Current clean candidate: `v0.11.0` — YouTube Organic DEV active, deployed, and smoke-tested

Current working delta: corrective outbox/generation/terminal/Redrive patch ถูก Apply และ Deploy ใน DEV แล้ว. Remote migrations 0005–0006 ผ่าน guarded rollout, controlled Redrive/replay ผ่านแบบ idempotent, Schedule/Owner Analytics เปิดกลับเฉพาะ DEV และ Redrive ปิด. Active Worker คือ `adc0f825-68e5-4231-847b-4b41a6592204`; Customer inventory 837-video Live UAT ยังเป็น Production release blocker.
""",
              """Official merged code baseline: `7d0e8e5` — Pre-Meta Batch C runtime/reliability hardening passed independent review and was squash-merged through PR #5. Remote migrations `0007`–`0008` and Batch C live rollout remain unexecuted.

Current working candidate: `v0.11.2-customer-real-uat-foundation`

Current UAT contract: customer-real UAT uses customer-owned source accounts/data with temporary developer-owned, customer-isolated Lark Base and Cloudflare resources. Runtime profile is `uat_chemistry_k`, while Canonical `customerKey`/connector `accountKey` stay `chemistry_k` across UAT and Production. Every UAT connector/schedule is disabled by default. Full contract: `docs/project-brain/customer-real-uat.md`.

Prior DEV operational state remains: corrective outbox/generation/terminal/Redrive patch was deployed in DEV; migrations 0005–0006 and controlled Redrive/replay passed; YouTube Schedule/Owner Analytics are enabled only in DEV and Production remains disabled. Customer-scale Live UAT is still required before Production.
""",
          )

          changed |= replace_once(
              'README.md',
              """Working candidate: `v0.11.0`

Official clean baseline: `v0.10.2-multi-channel-foundation-approved`

Corrective large-account Reliability patch ถูก Deploy ใน DEV แล้ว. Remote migrations 0005–0006 ผ่าน guarded rollout, controlled Redrive/replay ผ่านแบบ idempotent, YouTube Schedule/Owner Analytics เปิดกลับเฉพาะ DEV และ Redrive ปิด. Active Worker คือ `adc0f825-68e5-4231-847b-4b41a6592204`; Customer 837-video Live UAT ยังเป็น Production release blocker.
""",
              """Working candidate: `v0.11.2-customer-real-uat-foundation`

Official merged code baseline: `7d0e8e5` — Pre-Meta Batch C hardening passed independent review and was squash-merged through PR #5.

Customer-real UAT uses real customer-owned source accounts/data with a temporary developer-owned, customer-isolated Lark Base and Cloudflare environment. Use profile `uat_chemistry_k`; Canonical `customerKey` and connector `accountKey` remain `chemistry_k` for Production cutover. All UAT connectors and schedules stay disabled until channel-specific identity/source-contract preflight passes. See `docs/project-brain/customer-real-uat.md`.

Corrective large-account Reliability patch remains deployed only in DEV. Remote migrations 0005–0006 passed guarded rollout; migrations 0007–0008 and Batch C live rollout have not been applied. Production remains disabled.
""",
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          section = """## Unreleased — Customer-real UAT foundation — 2026-07-21

### Added
- Added a distinct fail-closed `uat` runtime environment and `uat_chemistry_k` profile.
- Separated infrastructure, source-asset and data ownership so UAT can use customer-real data while temporary Lark/Cloudflare resources remain developer-owned.
- Preserved `chemistry_k` as the Canonical customer/account identity across UAT and Production to prevent Stable-key drift during cutover.
- Added a customer-real UAT contract covering isolation, authorization, identity preflight, retention and TikTok-first rollout gates.

### Safety
- Every UAT connector and schedule remains disabled by default.
- TikTok live handle is not stored in Source and is required from Environment only when the connector is enabled.
- No Lark connection, customer-data read, Cloudflare resource creation, remote migration, deployment, live Queue message, external API call or Production mutation occurred in this source task.

"""
          if section not in text:
              marker = '# Changelog\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG marker not found')
              changelog.write_text(text.replace(marker, marker + section, 1))
              changed = True

          if not changed:
              print('documentation already current')
          PY

          git diff --check

      - name: Commit documentation closeout
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git add PROJECT_BRAIN.md README.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close customer-real UAT handoff"
          git push origin HEAD:work/customer-real-uat-foundation
