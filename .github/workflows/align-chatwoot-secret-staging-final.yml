name: Align Final Chatwoot Secret Staging

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    if: github.head_ref == 'hotfix/chatwoot-final-secret-staging'
    runs-on: mkt-ci
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-secret-staging
          fetch-depth: 0

      - name: Merge exact current main and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --quiet
          git merge --no-ff origin/main -m "merge: align final Chatwoot Secret staging with main"
          git push origin HEAD:hotfix/chatwoot-final-secret-staging
