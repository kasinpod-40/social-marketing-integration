name: Run Chatwoot Baseline Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/chatwoot-final-uat-existing-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-uat-existing-baseline
          fetch-depth: 0

      - name: Apply exact baseline-aware source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} not found exactly once')
              return text.replace(old, new, 1)

          lib_path = Path('scripts/lib/chatwoot-final-30d-daily-uat.js')
          lib = lib_path.read_text()
          lib, condition_count = re.subn(
              r"(\|\| snapshot\.chatwootTableCount !== 14 \|\| snapshot\.chatwootIndexCount !== 15)\s*\n\s*\|\| totalBusinessRows !== 0\) \{",
              r"\1) {",
              lib,
              count=1,
          )
          if condition_count != 1:
              raise SystemExit('zero-baseline preflight condition not found exactly once')
          lib = replace_once(
              lib,
              'Remote D1 is not a clean Chatwoot Initial-UAT target',
              'Remote D1 is not a valid Chatwoot Initial-UAT target',
              'zero-baseline preflight message',
          )
          marker = 'export function normalizeChatwootFinalUatSnapshot(row = {}) {'
          helpers = r'''export function mapChatwootFinalUatD1BaselineCounts(businessCounts = {}) {
            return deepFreeze(Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [
              spec.key,
              count(businessCounts?.[spec.d1Table], spec.d1Table),
            ])));
          }

          export function assertChatwootFinalUatBaselineCompatible(d1Counts = {}, larkCounts = {}) {
            const d1 = normalizeChatwootFinalUatLogicalCounts(d1Counts, 'd1');
            const lark = normalizeChatwootFinalUatLogicalCounts(larkCounts, 'lark');
            const larkExcess = CHATWOOT_FINAL_UAT_TABLES
              .filter((spec) => lark[spec.key] > d1[spec.key])
              .map((spec) => ({
                tableKey: spec.key,
                d1Rows: d1[spec.key],
                larkRows: lark[spec.key],
              }));
            if (larkExcess.length > 0) {
              throw uatError(
                'Lark Chatwoot baseline contains rows that are not present in D1',
                'CHATWOOT_FINAL_UAT_BASELINE_MISMATCH',
                { larkExcess },
              );
            }
            return deepFreeze({
              d1Counts: d1,
              larkCounts: lark,
              d1Rows: Object.values(d1).reduce((sum, value) => sum + value, 0),
              larkRows: Object.values(lark).reduce((sum, value) => sum + value, 0),
            });
          }

          export function assertChatwootFinalUatBaselinePreserved(
            baselineCounts = {},
            currentCounts = {},
            label = 'baseline',
          ) {
            const baseline = normalizeChatwootFinalUatLogicalCounts(
              baselineCounts,
              `${label}:baseline`,
            );
            const current = normalizeChatwootFinalUatLogicalCounts(
              currentCounts,
              `${label}:current`,
            );
            const decreases = CHATWOOT_FINAL_UAT_TABLES
              .filter((spec) => current[spec.key] < baseline[spec.key])
              .map((spec) => ({
                tableKey: spec.key,
                baselineRows: baseline[spec.key],
                currentRows: current[spec.key],
              }));
            if (decreases.length > 0) {
              throw uatError(
                'Chatwoot Final UAT reduced an existing business baseline',
                'CHATWOOT_FINAL_UAT_BASELINE_REGRESSION',
                { label, decreases },
              );
            }
            return deepFreeze({ accepted: true, label, baseline, current });
          }

          function normalizeChatwootFinalUatLogicalCounts(values = {}, label = 'counts') {
            return deepFreeze(Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [
              spec.key,
              count(values?.[spec.key], `${label}:${spec.key}`),
            ])));
          }

          '''
          lib = replace_once(lib, marker, helpers + marker, 'snapshot normalizer marker')
          lib_path.write_text(lib)

          script_path = Path('scripts/chatwoot-final-30d-daily-uat.mjs')
          script = script_path.read_text()
          script = replace_once(
              script,
              "  assertChatwootFinalUatConfirmation,\n  assertChatwootFinalUatPreflight,\n",
              "  assertChatwootFinalUatBaselineCompatible,\n  assertChatwootFinalUatBaselinePreserved,\n  assertChatwootFinalUatConfirmation,\n  assertChatwootFinalUatPreflight,\n",
              'operator baseline imports',
          )
          script = replace_once(
              script,
              "  createChatwootFinalUatSession,\n  normalizeChatwootFinalUatPreflight,\n",
              "  createChatwootFinalUatSession,\n  mapChatwootFinalUatD1BaselineCounts,\n  normalizeChatwootFinalUatPreflight,\n",
              'operator baseline map import',
          )
          script = replace_once(
              script,
              "  const preflightResult = await preflight(target);\n  await evidence(target, 'read-only-preflight', preflightResult);\n",
              "  const preflightResult = await preflight(target);\n  target.baseline = preflightResult.baseline;\n  await evidence(target, 'read-only-preflight', preflightResult);\n",
              'operator preflight baseline assignment',
          )
          script = replace_once(
              script,
              "    d1LarkParityTables: CHATWOOT_FINAL_UAT_TABLES.length,\n    initialRows: initial.parity.totalRows,\n",
              "    d1LarkParityTables: CHATWOOT_FINAL_UAT_TABLES.length,\n    baselineD1Rows: target.baseline.d1Rows,\n    baselineLarkRows: target.baseline.larkRows,\n    baselinePreserved: true,\n    initialRows: initial.parity.totalRows,\n",
              'operator summary baseline fields',
          )
          old_preflight = (
              "  const lark = await larkCounts(target, true);\n"
              "  const totalLark = Object.values(lark).reduce((sum, count) => sum + count, 0);\n"
              "  if (totalLark !== 0) fail('Lark Chatwoot tables must be empty before Initial UAT', 'CHATWOOT_FINAL_UAT_LARK_NOT_EMPTY', { totalLark });\n"
              "  return {\n"
              "    activeVersion,\n"
              "    pendingMigrations: 0,\n"
              "    requiredSecretNames: REQUIRED_SECRETS.length,\n"
              "    d1,\n"
              "    larkTableCount: CHATWOOT_FINAL_UAT_TABLES.length,\n"
              "    larkRows: totalLark,\n"
              "    remoteMutationCount: 0,\n"
              "  };\n"
          )
          new_preflight = (
              "  const lark = await larkCounts(target, true);\n"
              "  const baseline = assertChatwootFinalUatBaselineCompatible(\n"
              "    mapChatwootFinalUatD1BaselineCounts(d1.businessCounts),\n"
              "    lark,\n"
              "  );\n"
              "  return {\n"
              "    activeVersion,\n"
              "    pendingMigrations: 0,\n"
              "    requiredSecretNames: REQUIRED_SECRETS.length,\n"
              "    d1,\n"
              "    baseline,\n"
              "    larkTableCount: CHATWOOT_FINAL_UAT_TABLES.length,\n"
              "    larkRows: baseline.larkRows,\n"
              "    remoteMutationCount: 0,\n"
              "  };\n"
          )
          script = replace_once(script, old_preflight, new_preflight, 'operator Lark baseline preflight')
          old_completed = (
              "  const lark = await larkCounts(target);\n"
              "  const parity = compareChatwootD1LarkParity(completed.d1Counts, lark);\n"
              "  await evidence(target, `${label}-completed`, { snapshot: completed, parity });\n"
          )
          new_completed = (
              "  const lark = await larkCounts(target);\n"
              "  const d1Baseline = assertChatwootFinalUatBaselinePreserved(\n"
              "    target.baseline.d1Counts,\n"
              "    completed.d1Counts,\n"
              "    `${label}:d1`,\n"
              "  );\n"
              "  const larkBaseline = assertChatwootFinalUatBaselinePreserved(\n"
              "    target.baseline.larkCounts,\n"
              "    lark,\n"
              "    `${label}:lark`,\n"
              "  );\n"
              "  const parity = compareChatwootD1LarkParity(completed.d1Counts, lark);\n"
              "  await evidence(target, `${label}-completed`, {\n"
              "    snapshot: completed,\n"
              "    parity,\n"
              "    baseline: { d1: d1Baseline, lark: larkBaseline },\n"
              "  });\n"
          )
          script = replace_once(script, old_completed, new_completed, 'operator completed baseline checks')
          old_replay = (
              "  const replayLark = await larkCounts(target);\n"
              "  compareChatwootD1LarkParity(replay.d1Counts, replayLark);\n"
              "  if (stableJson(lark) !== stableJson(replayLark)) fail('Replay changed Lark counts', 'CHATWOOT_FINAL_UAT_REPLAY_INVALID', { label });\n"
          )
          new_replay = (
              "  const replayLark = await larkCounts(target);\n"
              "  assertChatwootFinalUatBaselinePreserved(\n"
              "    target.baseline.d1Counts,\n"
              "    replay.d1Counts,\n"
              "    `${label}:replay:d1`,\n"
              "  );\n"
              "  assertChatwootFinalUatBaselinePreserved(\n"
              "    target.baseline.larkCounts,\n"
              "    replayLark,\n"
              "    `${label}:replay:lark`,\n"
              "  );\n"
              "  compareChatwootD1LarkParity(replay.d1Counts, replayLark);\n"
              "  if (stableJson(lark) !== stableJson(replayLark)) fail('Replay changed Lark counts', 'CHATWOOT_FINAL_UAT_REPLAY_INVALID', { label });\n"
          )
          script = replace_once(script, old_replay, new_replay, 'operator replay baseline checks')
          script_path.write_text(script)

          test_path = Path('tests/application/chatwoot-final-30d-daily-uat.test.js')
          test = test_path.read_text()
          test = replace_once(
              test,
              "  assertChatwootFinalUatConfirmation,\n  assertChatwootFinalUatPreflight,\n",
              "  assertChatwootFinalUatBaselineCompatible,\n  assertChatwootFinalUatBaselinePreserved,\n  assertChatwootFinalUatConfirmation,\n  assertChatwootFinalUatPreflight,\n",
              'test baseline imports',
          )
          test = replace_once(
              test,
              "  createChatwootFinalUatSession,\n  normalizeChatwootFinalUatPreflight,\n",
              "  createChatwootFinalUatSession,\n  mapChatwootFinalUatD1BaselineCounts,\n  normalizeChatwootFinalUatPreflight,\n",
              'test baseline map import',
          )
          replacement_test = r'''test('preflight accepts existing Business baseline while retaining exact schema and idle-state gates', () => {
            const row = {
              active_chatwoot_work: 0,
              active_chatwoot_locks: 0,
              prior_chatwoot_operations: 1,
              chatwoot_table_count: 14,
              chatwoot_index_count: 15,
            };
            for (const spec of CHATWOOT_FINAL_UAT_TABLES) row[spec.d1Table] = 0;
            row.chatwoot_account_state = 4;
            row.chatwoot_conversation_state = 8;
            const normalized = normalizeChatwootFinalUatPreflight(row);
            assert.equal(assertChatwootFinalUatPreflight(normalized).totalBusinessRows, 12);
            row.active_chatwoot_work = 1;
            assert.throws(
              () => assertChatwootFinalUatPreflight(normalizeChatwootFinalUatPreflight(row)),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_PREFLIGHT_BLOCKED',
            );
          });

          test('baseline contract allows Lark to lag D1, blocks Lark excess and prevents row loss', () => {
            const d1Business = Object.fromEntries(
              [...new Set(CHATWOOT_FINAL_UAT_TABLES.map((spec) => spec.d1Table))]
                .map((tableName) => [tableName, 2]),
            );
            const d1 = mapChatwootFinalUatD1BaselineCounts(d1Business);
            const lark = Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [spec.key, 1]));
            const compatible = assertChatwootFinalUatBaselineCompatible(d1, lark);
            assert.ok(compatible.d1Rows > compatible.larkRows);
            assert.equal(assertChatwootFinalUatBaselinePreserved(
              d1,
              Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [
                spec.key,
                d1[spec.key] + 1,
              ])),
              'initial:d1',
            ).accepted, true);
            assert.throws(
              () => assertChatwootFinalUatBaselineCompatible(d1, {
                ...lark,
                rawChatwootAccounts: d1.rawChatwootAccounts + 1,
              }),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_BASELINE_MISMATCH',
            );
            assert.throws(
              () => assertChatwootFinalUatBaselinePreserved(d1, {
                ...d1,
                rawChatwootAccounts: d1.rawChatwootAccounts - 1,
              }, 'initial:d1'),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_BASELINE_REGRESSION',
            );
          });'''
          test, test_count = re.subn(
              r"test\('preflight requires exact 14 tables, 15 indexes, no active state and zero Business rows',[\s\S]*?\n\}\);",
              replacement_test,
              test,
              count=1,
          )
          if test_count != 1:
              raise SystemExit('zero-baseline test not found exactly once')
          test = replace_once(
              test,
              "  assert.match(source, /compareChatwootD1LarkParity/u);\n  assert.match(source, /CHATWOOT_FINAL_UAT_SUCCESS_MARKER/u);\n",
              "  assert.match(source, /compareChatwootD1LarkParity/u);\n  assert.match(source, /assertChatwootFinalUatBaselineCompatible/u);\n  assert.match(source, /assertChatwootFinalUatBaselinePreserved/u);\n  assert.doesNotMatch(source, /CHATWOOT_FINAL_UAT_LARK_NOT_EMPTY/u);\n  assert.match(source, /CHATWOOT_FINAL_UAT_SUCCESS_MARKER/u);\n",
              'operator source baseline assertions',
          )
          test_path.write_text(test)

          Path('.github/workflows/apply-chatwoot-baseline-hotfix.yml').unlink()
          Path('.github/workflows/run-chatwoot-patch-on-pr.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit exact source and test patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply baseline-aware Final UAT"
          git push origin HEAD:hotfix/chatwoot-final-uat-existing-baseline
