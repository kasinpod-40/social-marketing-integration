name: Run Chatwoot Baseline Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/chatwoot-final-uat-existing-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-uat-existing-baseline
          fetch-depth: 0

      - name: Execute reviewed patch payload
        shell: bash
        run: |
          awk '/^          python <<'"'"'PY'"'"'$/{capture=1;next} /^          PY$/{capture=0} capture{sub(/^          /,""); print}' \
            .github/workflows/apply-chatwoot-baseline-hotfix.yml > /tmp/apply-chatwoot-baseline-hotfix.py

          python <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/apply-chatwoot-baseline-hotfix.py')
          payload = path.read_text()
          replacement = r'''
          condition = """      || snapshot.chatwootTableCount !== 14 || snapshot.chatwootIndexCount !== 15
              || totalBusinessRows !== 0) {"""
          condition_replacement = """      || snapshot.chatwootTableCount !== 14 || snapshot.chatwootIndexCount !== 15) {"""
          if lib.count(condition) != 1:
            raise SystemExit('preflight zero-baseline condition not found exactly once')
          lib = lib.replace(condition, condition_replacement)
          old_message = 'Remote D1 is not a clean Chatwoot Initial-UAT target'
          if lib.count(old_message) != 1:
            raise SystemExit('preflight zero-baseline message not found exactly once')
          lib = lib.replace(old_message, 'Remote D1 is not a valid Chatwoot Initial-UAT target')
          '''
          payload, count = re.subn(
              r'\nold = """  if \(snapshot\.activeChatwootWork[\s\S]*?\nlib = lib\.replace\(old, new\)\n',
              '\n' + replacement,
              payload,
              count=1,
          )
          if count != 1:
            raise SystemExit('strict preflight patch block not found exactly once')
          path.write_text(payload)
          PY

          python /tmp/apply-chatwoot-baseline-hotfix.py
          rm -f .github/workflows/run-chatwoot-patch-on-pr.yml
          git diff --check

      - name: Commit exact source and test patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply baseline-aware Final UAT"
          git push origin HEAD:hotfix/chatwoot-final-uat-existing-baseline
