name: Cleanup Report Runtime Validation

on:
  push:
    branches:
      - codex/report-multichannel-runtime

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'ci: clean temporary report validation branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/report-multichannel-runtime
          fetch-depth: 0

      - name: Delete temporary branch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete codex/report-multichannel-runtime-export
          rm .github/workflows/cleanup-report-runtime-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cleanup-report-runtime-validation.yml
          git commit -m 'ci: remove temporary report validation cleanup'
          git push origin HEAD:codex/report-multichannel-runtime
