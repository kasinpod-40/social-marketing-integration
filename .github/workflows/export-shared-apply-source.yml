name: Apply Guarded Shared Apply Patch

on:
  push:
    branches:
      - work/shared-table-schema-apply
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: guarded-shared-apply-patch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/shared-table-schema-apply
          fetch-depth: 0

      - name: Assemble and verify reviewed patch
        run: |
          cat .github/shared-apply.patch.gz.b64 \
              .github/shared-apply.patch.gz.b64.part01 \
              .github/shared-apply.patch.gz.b64.part02 \
              .github/shared-apply.patch.gz.b64.part03 \
              .github/shared-apply.patch.gz.b64.part04 > /tmp/shared-apply.patch.gz.b64
          base64 --decode /tmp/shared-apply.patch.gz.b64 | gzip --decompress > /tmp/shared-apply.patch
          echo "23b92dde84f2aeb2c14e728339cbc157e2d9005e3b616699996efc39e09fe010  /tmp/shared-apply.patch" | sha256sum --check -
          git apply --check /tmp/shared-apply.patch

      - name: Replace staging files with reviewed implementation
        run: |
          git apply /tmp/shared-apply.patch
          rm -f .github/shared-apply.patch.gz.b64 .github/shared-apply.patch.gz.b64.part*
          git diff --check

      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add guarded shared-table schema apply"
          git push origin HEAD:work/shared-table-schema-apply
