name: Apply Report Closeout Sync Log Key Hotfix

on:
  push:
    branches:
      - hotfix/report-closeout-sync-log-key

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact contract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          operator_path = Path('scripts/report-runtime-closeout-operator.mjs')
          operator = operator_path.read_text(encoding='utf-8')
          old = "  mktSyncLog: 'sync_run_id',"
          new = "  mktSyncLog: 'sync_id',"
          if operator.count(old) != 1:
              raise SystemExit(f'expected exactly one stale sync-log key, found {operator.count(old)}')
          operator_path.write_text(operator.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/scripts/report-runtime-closeout-operator.test.js')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = "import assert from 'node:assert/strict';\n"
          import_line = "import { readFileSync } from 'node:fs';\n"
          if import_line not in test:
              if test.count(import_anchor) != 1:
                  raise SystemExit('test import anchor mismatch')
              test = test.replace(import_anchor, import_anchor + import_line, 1)
          regression = """

test('Report closeout Lark preflight uses the shared reliability sync_id key', () => {
  const source = readFileSync(
    new URL('../../scripts/report-runtime-closeout-operator.mjs', import.meta.url),
    'utf8',
  );
  assert.match(source, /mktSyncLog:\\s*'sync_id'/u);
  assert.doesNotMatch(source, /mktSyncLog:\\s*'sync_run_id'/u);
});
"""
          if "shared reliability sync_id key" not in test:
              test = test.rstrip() + regression
          test_path.write_text(test, encoding='utf-8')

          doc_path = Path('docs/tasks/report-runtime-closeout-uat.md')
          doc = doc_path.read_text(encoding='utf-8')
          note = """

## Live preflight compatibility hotfix — 2026-07-29

The first closeout execution remained mutation-free and stopped during Lark metadata preflight because the
operator required `MKT_Sync_Log.sync_run_id`. The existing Shared `LarkReliabilityStore` has always upserted
that table by the real Integration Workspace Stable key `sync_id`. The operator preflight is corrected to
use `sync_id`; `MKT_System_Alerts.alert_id` and all Report table keys remain unchanged.

The stopped attempt had `activeDeploymentAttempted=false`; no Worker deployment, Queue message, D1 write,
Lark record write, Schedule/AI activation or Production action occurred.
"""
          if "Live preflight compatibility hotfix" not in doc:
              doc = doc.rstrip() + note
          doc_path.write_text(doc, encoding='utf-8')

          Path('.github/workflows/report-closeout-sync-log-hotfix.yml').unlink()
          PY
      - name: Verify focused contract
        run: node --test tests/scripts/report-runtime-closeout-operator.test.js
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/report-runtime-closeout-operator.mjs tests/scripts/report-runtime-closeout-operator.test.js docs/tasks/report-runtime-closeout-uat.md .github/workflows/report-closeout-sync-log-hotfix.yml
          git commit -m "fix: align report closeout sync log key"
          git push origin HEAD:hotfix/report-closeout-sync-log-key
