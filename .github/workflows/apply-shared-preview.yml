name: Apply Shared Preview Patch

on:
  push:
    branches:
      - work/shared-table-dev-schema-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/shared-table-dev-schema-preview
          fetch-depth: 0

      - name: Assemble reviewed patch
        run: |
          cat .github/shared-preview.patch.part00 \
              .github/shared-preview.patch.part01 \
              .github/shared-preview.patch.part02 \
              .github/shared-preview.patch.part03 \
              .github/shared-preview.patch.part04 > /tmp/shared-preview.patch
          sha256sum /tmp/shared-preview.patch
          cp .github/workflows/apply-shared-preview.yml /tmp/apply-shared-preview.yml

      - name: Validate patch against main
        run: |
          git fetch origin main
          git worktree add /tmp/shared-preview-main origin/main
          if ! (cd /tmp/shared-preview-main && git apply --check --exclude=docs/current-task.md /tmp/shared-preview.patch) 2> /tmp/shared-preview-apply-error.txt; then
            cp /tmp/shared-preview-apply-error.txt .github/shared-preview-apply-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/shared-preview-apply-error.txt
            git commit -m "chore: record shared preview patch error"
            git push origin HEAD:work/shared-table-dev-schema-preview
            exit 1
          fi

      - name: Replace staging files with reviewed implementation
        run: |
          git rm -r --ignore-unmatch .
          git checkout origin/main -- .
          git apply --exclude=docs/current-task.md /tmp/shared-preview.patch
          mkdir -p .github/workflows
          cp /tmp/apply-shared-preview.yml .github/workflows/apply-shared-preview.yml
          test -z "$(find .github -maxdepth 1 -type f -name 'shared-preview.patch.part*' -print -quit)"
          git diff --check

      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add shared-table schema preview"
          git push origin HEAD:work/shared-table-dev-schema-preview
