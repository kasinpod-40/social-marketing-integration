name: Apply Chatwoot Baseline Hotfix

on:
  push:
    branches:
      - hotfix/chatwoot-final-uat-existing-baseline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply baseline-aware Final UAT') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/chatwoot-final-uat-existing-baseline
          fetch-depth: 0

      - name: Apply exact baseline-aware patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          lib_path = Path('scripts/lib/chatwoot-final-30d-daily-uat.js')
          lib = lib_path.read_text()

          old = """  if (snapshot.activeChatwootWork !== 0 || snapshot.activeChatwootLocks !== 0
              || snapshot.chatwootTableCount !== 14 || snapshot.chatwootIndexCount !== 15
              || totalBusinessRows !== 0) {
            throw uatError('Remote D1 is not a clean Chatwoot Initial-UAT target', 'CHATWOOT_FINAL_UAT_PREFLIGHT_BLOCKED', {
          """
          new = """  if (snapshot.activeChatwootWork !== 0 || snapshot.activeChatwootLocks !== 0
              || snapshot.chatwootTableCount !== 14 || snapshot.chatwootIndexCount !== 15) {
            throw uatError('Remote D1 is not a valid Chatwoot Initial-UAT target', 'CHATWOOT_FINAL_UAT_PREFLIGHT_BLOCKED', {
          """
          if lib.count(old) != 1:
            raise SystemExit('preflight zero-baseline contract not found exactly once')
          lib = lib.replace(old, new)

          marker = "export function normalizeChatwootFinalUatSnapshot(row = {}) {"
          helpers = r"""
          export function mapChatwootFinalUatD1BaselineCounts(businessCounts = {}) {
            return deepFreeze(Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [
              spec.key,
              count(businessCounts?.[spec.d1Table], spec.d1Table),
            ])));
          }

          export function assertChatwootFinalUatBaselineCompatible(d1Counts = {}, larkCounts = {}) {
            const d1 = normalizeLogicalTargetCounts(d1Counts, 'd1');
            const lark = normalizeLogicalTargetCounts(larkCounts, 'lark');
            const larkExcess = CHATWOOT_FINAL_UAT_TABLES
              .filter((spec) => lark[spec.key] > d1[spec.key])
              .map((spec) => ({
                tableKey: spec.key,
                d1Rows: d1[spec.key],
                larkRows: lark[spec.key],
              }));
            if (larkExcess.length > 0) {
              throw uatError(
                'Lark Chatwoot baseline contains rows that are not present in D1',
                'CHATWOOT_FINAL_UAT_BASELINE_MISMATCH',
                { larkExcess },
              );
            }
            return deepFreeze({
              d1Counts: d1,
              larkCounts: lark,
              d1Rows: Object.values(d1).reduce((sum, value) => sum + value, 0),
              larkRows: Object.values(lark).reduce((sum, value) => sum + value, 0),
            });
          }

          export function assertChatwootFinalUatBaselinePreserved(
            baselineCounts = {},
            currentCounts = {},
            label = 'baseline',
          ) {
            const baseline = normalizeLogicalTargetCounts(baselineCounts, `${label}:baseline`);
            const current = normalizeLogicalTargetCounts(currentCounts, `${label}:current`);
            const decreases = CHATWOOT_FINAL_UAT_TABLES
              .filter((spec) => current[spec.key] < baseline[spec.key])
              .map((spec) => ({
                tableKey: spec.key,
                baselineRows: baseline[spec.key],
                currentRows: current[spec.key],
              }));
            if (decreases.length > 0) {
              throw uatError(
                'Chatwoot Final UAT reduced an existing business baseline',
                'CHATWOOT_FINAL_UAT_BASELINE_REGRESSION',
                { label, decreases },
              );
            }
            return deepFreeze({ accepted: true, label, baseline, current });
          }

          function normalizeLogicalTargetCounts(values = {}, label = 'counts') {
            return deepFreeze(Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [
              spec.key,
              count(values?.[spec.key], `${label}:${spec.key}`),
            ])));
          }

          """
          if lib.count(marker) != 1:
            raise SystemExit('snapshot normalizer marker not found exactly once')
          lib = lib.replace(marker, helpers + marker)
          lib_path.write_text(lib)

          script_path = Path('scripts/chatwoot-final-30d-daily-uat.mjs')
          script = script_path.read_text()

          import_old = """  assertChatwootFinalUatConfirmation,
            assertChatwootFinalUatPreflight,
          """
          import_new = """  assertChatwootFinalUatBaselineCompatible,
            assertChatwootFinalUatBaselinePreserved,
            assertChatwootFinalUatConfirmation,
            assertChatwootFinalUatPreflight,
          """
          if script.count(import_old) != 1:
            raise SystemExit('operator import marker not found exactly once')
          script = script.replace(import_old, import_new)

          map_import_old = """  createChatwootFinalUatSession,
            normalizeChatwootFinalUatPreflight,
          """
          map_import_new = """  createChatwootFinalUatSession,
            mapChatwootFinalUatD1BaselineCounts,
            normalizeChatwootFinalUatPreflight,
          """
          if script.count(map_import_old) != 1:
            raise SystemExit('operator map import marker not found exactly once')
          script = script.replace(map_import_old, map_import_new)

          preflight_call_old = """  const preflightResult = await preflight(target);
            await evidence(target, 'read-only-preflight', preflightResult);
          """
          preflight_call_new = """  const preflightResult = await preflight(target);
            target.baseline = preflightResult.baseline;
            await evidence(target, 'read-only-preflight', preflightResult);
          """
          if script.count(preflight_call_old) != 1:
            raise SystemExit('preflight assignment marker not found exactly once')
          script = script.replace(preflight_call_old, preflight_call_new)

          summary_old = """    d1LarkParityTables: CHATWOOT_FINAL_UAT_TABLES.length,
              initialRows: initial.parity.totalRows,
          """
          summary_new = """    d1LarkParityTables: CHATWOOT_FINAL_UAT_TABLES.length,
              baselineD1Rows: target.baseline.d1Rows,
              baselineLarkRows: target.baseline.larkRows,
              baselinePreserved: true,
              initialRows: initial.parity.totalRows,
          """
          if script.count(summary_old) != 1:
            raise SystemExit('summary marker not found exactly once')
          script = script.replace(summary_old, summary_new)

          preflight_old = """  const lark = await larkCounts(target, true);
            const totalLark = Object.values(lark).reduce((sum, count) => sum + count, 0);
            if (totalLark !== 0) fail('Lark Chatwoot tables must be empty before Initial UAT', 'CHATWOOT_FINAL_UAT_LARK_NOT_EMPTY', { totalLark });
            return {
              activeVersion,
              pendingMigrations: 0,
              requiredSecretNames: REQUIRED_SECRETS.length,
              d1,
              larkTableCount: CHATWOOT_FINAL_UAT_TABLES.length,
              larkRows: totalLark,
              remoteMutationCount: 0,
            };
          """
          preflight_new = """  const lark = await larkCounts(target, true);
            const baseline = assertChatwootFinalUatBaselineCompatible(
              mapChatwootFinalUatD1BaselineCounts(d1.businessCounts),
              lark,
            );
            return {
              activeVersion,
              pendingMigrations: 0,
              requiredSecretNames: REQUIRED_SECRETS.length,
              d1,
              baseline,
              larkTableCount: CHATWOOT_FINAL_UAT_TABLES.length,
              larkRows: baseline.larkRows,
              remoteMutationCount: 0,
            };
          """
          if script.count(preflight_old) != 1:
            raise SystemExit('Lark empty-target block not found exactly once')
          script = script.replace(preflight_old, preflight_new)

          completed_old = """  const lark = await larkCounts(target);
            const parity = compareChatwootD1LarkParity(completed.d1Counts, lark);
            await evidence(target, `${label}-completed`, { snapshot: completed, parity });
          """
          completed_new = """  const lark = await larkCounts(target);
            const d1Baseline = assertChatwootFinalUatBaselinePreserved(
              target.baseline.d1Counts,
              completed.d1Counts,
              `${label}:d1`,
            );
            const larkBaseline = assertChatwootFinalUatBaselinePreserved(
              target.baseline.larkCounts,
              lark,
              `${label}:lark`,
            );
            const parity = compareChatwootD1LarkParity(completed.d1Counts, lark);
            await evidence(target, `${label}-completed`, {
              snapshot: completed,
              parity,
              baseline: { d1: d1Baseline, lark: larkBaseline },
            });
          """
          if script.count(completed_old) != 1:
            raise SystemExit('completed parity block not found exactly once')
          script = script.replace(completed_old, completed_new)

          replay_old = """  const replayLark = await larkCounts(target);
            compareChatwootD1LarkParity(replay.d1Counts, replayLark);
            if (stableJson(lark) !== stableJson(replayLark)) fail('Replay changed Lark counts', 'CHATWOOT_FINAL_UAT_REPLAY_INVALID', { label });
          """
          replay_new = """  const replayLark = await larkCounts(target);
            assertChatwootFinalUatBaselinePreserved(
              target.baseline.d1Counts,
              replay.d1Counts,
              `${label}:replay:d1`,
            );
            assertChatwootFinalUatBaselinePreserved(
              target.baseline.larkCounts,
              replayLark,
              `${label}:replay:lark`,
            );
            compareChatwootD1LarkParity(replay.d1Counts, replayLark);
            if (stableJson(lark) !== stableJson(replayLark)) fail('Replay changed Lark counts', 'CHATWOOT_FINAL_UAT_REPLAY_INVALID', { label });
          """
          if script.count(replay_old) != 1:
            raise SystemExit('replay parity block not found exactly once')
          script = script.replace(replay_old, replay_new)
          script_path.write_text(script)

          test_path = Path('tests/application/chatwoot-final-30d-daily-uat.test.js')
          test = test_path.read_text()

          test_import_old = """  assertChatwootFinalUatConfirmation,
            assertChatwootFinalUatPreflight,
          """
          test_import_new = """  assertChatwootFinalUatBaselineCompatible,
            assertChatwootFinalUatBaselinePreserved,
            assertChatwootFinalUatConfirmation,
            assertChatwootFinalUatPreflight,
          """
          if test.count(test_import_old) != 1:
            raise SystemExit('test import marker not found exactly once')
          test = test.replace(test_import_old, test_import_new)

          test_map_old = """  createChatwootFinalUatSession,
            normalizeChatwootFinalUatPreflight,
          """
          test_map_new = """  createChatwootFinalUatSession,
            mapChatwootFinalUatD1BaselineCounts,
            normalizeChatwootFinalUatPreflight,
          """
          if test.count(test_map_old) != 1:
            raise SystemExit('test map import marker not found exactly once')
          test = test.replace(test_map_old, test_map_new)

          test_old = """test('preflight requires exact 14 tables, 15 indexes, no active state and zero Business rows', () => {
            const row = {
              active_chatwoot_work: 0,
              active_chatwoot_locks: 0,
              prior_chatwoot_operations: 0,
              chatwoot_table_count: 14,
              chatwoot_index_count: 15,
            };
            for (const spec of CHATWOOT_FINAL_UAT_TABLES) row[spec.d1Table] = 0;
            const normalized = normalizeChatwootFinalUatPreflight(row);
            assert.equal(assertChatwootFinalUatPreflight(normalized).totalBusinessRows, 0);
            row.chatwoot_conversation_state = 1;
            assert.throws(
              () => assertChatwootFinalUatPreflight(normalizeChatwootFinalUatPreflight(row)),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_PREFLIGHT_BLOCKED',
            );
          });
          """
          test_new = """test('preflight accepts existing Business baseline while retaining exact schema and idle-state gates', () => {
            const row = {
              active_chatwoot_work: 0,
              active_chatwoot_locks: 0,
              prior_chatwoot_operations: 1,
              chatwoot_table_count: 14,
              chatwoot_index_count: 15,
            };
            for (const spec of CHATWOOT_FINAL_UAT_TABLES) row[spec.d1Table] = 0;
            row.chatwoot_account_state = 4;
            row.chatwoot_conversation_state = 8;
            const normalized = normalizeChatwootFinalUatPreflight(row);
            assert.equal(assertChatwootFinalUatPreflight(normalized).totalBusinessRows, 12);
            row.active_chatwoot_work = 1;
            assert.throws(
              () => assertChatwootFinalUatPreflight(normalizeChatwootFinalUatPreflight(row)),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_PREFLIGHT_BLOCKED',
            );
          });

          test('baseline contract allows Lark to lag D1, blocks Lark excess and prevents row loss', () => {
            const d1Business = Object.fromEntries(
              [...new Set(CHATWOOT_FINAL_UAT_TABLES.map((spec) => spec.d1Table))]
                .map((tableName) => [tableName, 2]),
            );
            const d1 = mapChatwootFinalUatD1BaselineCounts(d1Business);
            const lark = Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [spec.key, 1]));
            const compatible = assertChatwootFinalUatBaselineCompatible(d1, lark);
            assert.ok(compatible.d1Rows > compatible.larkRows);
            assert.equal(assertChatwootFinalUatBaselinePreserved(
              d1,
              Object.fromEntries(CHATWOOT_FINAL_UAT_TABLES.map((spec) => [spec.key, d1[spec.key] + 1])),
              'initial:d1',
            ).accepted, true);
            assert.throws(
              () => assertChatwootFinalUatBaselineCompatible(d1, {
                ...lark,
                rawChatwootAccounts: d1.rawChatwootAccounts + 1,
              }),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_BASELINE_MISMATCH',
            );
            assert.throws(
              () => assertChatwootFinalUatBaselinePreserved(d1, {
                ...d1,
                rawChatwootAccounts: d1.rawChatwootAccounts - 1,
              }, 'initial:d1'),
              (error) => error?.code === 'CHATWOOT_FINAL_UAT_BASELINE_REGRESSION',
            );
          });
          """
          if test.count(test_old) != 1:
            raise SystemExit('old zero-baseline test not found exactly once')
          test = test.replace(test_old, test_new)

          source_assert_old = """  assert.match(source, /compareChatwootD1LarkParity/u);
            assert.match(source, /CHATWOOT_FINAL_UAT_SUCCESS_MARKER/u);
          """
          source_assert_new = """  assert.match(source, /compareChatwootD1LarkParity/u);
            assert.match(source, /assertChatwootFinalUatBaselineCompatible/u);
            assert.match(source, /assertChatwootFinalUatBaselinePreserved/u);
            assert.doesNotMatch(source, /CHATWOOT_FINAL_UAT_LARK_NOT_EMPTY/u);
            assert.match(source, /CHATWOOT_FINAL_UAT_SUCCESS_MARKER/u);
          """
          if test.count(source_assert_old) != 1:
            raise SystemExit('operator source assertion marker not found exactly once')
          test = test.replace(source_assert_old, source_assert_new)
          test_path.write_text(test)

          Path('.github/workflows/apply-chatwoot-baseline-hotfix.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/chatwoot-final-30d-daily-uat.mjs \
                  scripts/lib/chatwoot-final-30d-daily-uat.js \
                  tests/application/chatwoot-final-30d-daily-uat.test.js \
                  .github/workflows/apply-chatwoot-baseline-hotfix.yml
          git commit -m "fix: apply baseline-aware Final UAT"
          git push origin HEAD:hotfix/chatwoot-final-uat-existing-baseline
